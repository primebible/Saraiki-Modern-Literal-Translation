book: "پیدائش"
chapter: 7
verses:
  - verse: 1
    text: "تے خداوند نے نوح نوں آکھیا: 'تُو اپنے سارے گھر واریاں نال کشتی وچ آ، کیوں جو میں ایس پیڑی وچ تینوں اپنے سامنے راستباز ویکھیا اے.'"
  - verse: 2
    text: "تُو اپنے نال ہر پاک جانور دے سات سات جوڑے، نر تے مادہ، لے جا؛ تے جو جانور ناپاک نیں اوہناں وچوں دو دو، نر تے مادہ، لے جا۔"
  - verse: 3
    text: "آسمان دے پرندیاں وچوں وی سات سات، نر تے مادہ، تاں جو ساری زمین دے مُکھ اُتے نسل زندہ رہے۔"
  - verse: 4
    text: "ست ݙینہاں بعد میں زمین اُتے چالیس ݙینہے تے چالیس راتاں میہہ وساواں گا، تے ہر جیتی چیز جیہڑی میں بنائی اے اوہنوں زمین دے مُکھ تُوں مٹا دیساں گا۔'"
  - verse: 5
    text: "تے نوح نے جیہڑا جیہڑا خداوند نے حکم دِتا، اوہ سبھ کیتا۔"
  - verse: 6
    text: "نوح چھے سو سال دا ہا جیں ویلے سیلاب دے پانی زمین اُتے آئے۔"
  - verse: 7
    text: "سو نوح اپنے پتران، اپنی بیوی، تے اپنے پتران دیاں زالاں نال، سیلاب دے پانی دے کارن، کشتی وچ ونجھیا۔"
  - verse: 8
    text: "پاک تے ناپاک جانور، پرندے، تے جیہڑی جیہڑی چیز زمین اُتے رینگدی اے،"
  - verse: 9
    text: "اوہ دو دو جوڑے، نر تے مادہ ہو کے، نوح کول کشتی وچ داخل ہوئیاں، جیویں خدا نے نوح نوں حکم دِتا۔"
  - verse: 10
    text: "ست ݙینہاں بعد، سیلاب دے پانی زمین اُتے آئے۔"
  - verse: 11
    text: "نوح دی عمر دے چھے سویں سال وچ، دوجھے مہینے دے سترھویں ݙینہے، اوہ دن وڈھی گہرائی دے سارے چشمے پھٹ نکلے، تے آسمان دیاں کھڑکیاں کھُل گئیاں۔"
  - verse: 12
    text: "تے زمین اُتے چالیس ݙینہے تے چالیس راتاں میہہ وسیا۔"
  - verse: 13
    text: "اوہو دن نوح تے سام، حام، یافث (نوح دے پتر)، تے نوح دی بیوی تے اوہدے پتران دیاں تِنیں زالاں، سارے مل کے کشتی وچ داخل ہوئیاں۔"
  - verse: 14
    text: "اوہ، تے ہر جانور اپنی اپنی قسم مطابق، تے سارے مویشی اپنی اپنی قسم مطابق، تے زمین اُتے رینگن آلی ہر چیز اپنی اپنی قسم مطابق، تے ہر طرح دے پرندے اپنی اپنی قسم مطابق، ہر قسم دے پرندے۔"
  - verse: 15
    text: "ساری بشر وچوں، جیہڑیاں وچ زندگی دی سانس ہئی، اوہ دو دو ہو کے نوح کول کشتی وچ داخل ہوئیاں۔"
  - verse: 16
    text: "تے جیہڑے اندر گئے، اوہ سارے گوشت وچوں نر تے مادہ ہو کے گئے، جیویں خدا نے اوہنوں حکم دِتا؛ تے خداوند نے اوہدے پچھے دروازہ بند کر دِتا۔"
  - verse: 17
    text: "سیلاب چالیس ݙینہے تک زمین اُتے رہا؛ پانی ودھیا تے کشتی نوں چک لیا، تے اوہ زمین توں اُچھی ہو گئی۔"
  - verse: 18
    text: "پانی وادھدا گیا تے زمین اُتے بہت ودھ گیا، تے کشتی پانی دے مُکھ اُتے تُردی رہی۔"
  - verse: 19
    text: "پانی زمین اُتے بہت ہی ودھ گیا؛ سارے وڈھے پہاڑ جیہڑے سارے آسمان تھلے سن ڈھک گئے۔"
  - verse: 20
    text: "پانی پندرہ ذراع ہور وادھ گیا، تے پہاڑ ڈھک گئے۔"
  - verse: 21
    text: "ساری بشر جیہڑی زمین اُتے ہِلدی پھِلدی ہئی مر گئی — پرندے، مویشی، جانور، ہر رینگن آلی چیز، تے ہر انسان۔"
  - verse: 22
    text: "جیہڑے وی خشکی اُتے سن، جیہناں دے نتھنیاں وچ زندگی دی روح دا ساہ ہا، اوہ سارے مر گئے۔"
  - verse: 23
    text: "تے زمین دے مُکھ اُتے جیہڑی وی زندہ چیز سی — انسان، مویشی، رینگن آلیاں چیزاں، تے آسمان دے پرندے — سب مٹا دِتے گئے؛ صرف نوح تے اوہ جیہڑے اوہدے نال کشتی وچ سن، بچ رہے۔"
  - verse: 24
    text: "تے پانی ایک سو پچاس ݙینہے تک زمین اُتے غالب رہا۔"
