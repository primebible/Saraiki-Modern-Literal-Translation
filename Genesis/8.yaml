book: "پیدائش"
chapter: 8
verses:
  - verse: 1
    text: "خدا نے نوح نوں, سارے جانوراں تے سارے مویشی جیہڑے اوہدے نال کشتی وچ سن, یاد کیتا, تے خدا نے زمین اُتے ہوا چلا دِتی. پانی گھٹ گیا."
  - verse: 2
    text: "وڈھی گہرائی دے چشمے تے آسمان دیاں کھڑکیاں وی بند ہو گئیاں, تے آسمان تُوں میہہ رک گیا."
  - verse: 3
    text: "پانی لگاتار زمین تُوں واپس ہٹدے پئے. ایک سو پچاس ݙینہے مُکن تائیں پانی گھٹ گیا."
  - verse: 4
    text: "ستویں مہینے دے سترھویں ݙینہے کشتی ارارات دے پہاڑاں اُتے ٹھہر گئی."
  - verse: 5
    text: "پانی دسویں مہینے تائیں لگاتار گھٹدے پئے. دسویں مہینے دے پہلے ݙینہے پہاڑاں دیاں چوٹیاں نظر آ گئیاں."
  - verse: 6
    text: "چالیس ݙینہاں دے آخر وچ نوح نے اوہ کھڑکی کھولی جیہڑی اوہنے کشتی وچ بنائی سی."
  - verse: 7
    text: "تے اوہنے اک کوّا چھوڑیا. اوہ آندا جاندا ریا جندھ تائیں پانی زمین تُوں سُک نہ گیا."
  - verse: 8
    text: "پھر اوہنے کبوتری چھوڑئی تاں جو ویکھے کہ پانی زمین دے مُکھ تُوں گھٹیا اے کہ نئیں."
  - verse: 9
    text: "پر کبوتری نوں پَیر رکھݨ لئی کوئی تھاں نہ لبی, تے اوہ اوہدے کول کشتی وچ واپس آ گئی, کیوں جو ساری زمین دے مُکھ اُتے پانی ہا. اوہنے اپنا ہتھ وڈھایا, اوہنوں پھڑ کے اپنے کول کشتی وچ لے آیا."
  - verse: 10
    text: "اوہ ہور ست ݙینہاں انتظار کیتا, تے پھر کبوتری کشتی تُوں چھوڑئی."
  - verse: 11
    text: "شام نوں کبوتری اوہدے کول واپس آئی, تے ویکھو, اوہدے منہ وچ زیتون دا تازہ توڑیا پتّا ہا. سو نوح نوں پتا لگ گیا کہ زمین تُوں پانی گھٹ گیا اے."
  - verse: 12
    text: "اوہ ہور ست ݙینہاں انتظار کیتا تے کبوتری چھوڑئی, تے اوہ ہن اوہدے کول واپس نہ آئی."
  - verse: 13
    text: "نوح دی عمر دے چھے سو اک سال وچ, پہلے مہینے دے پہلے ݙینہے, زمین تُوں پانی سُک گیا. نوح نے کشتی دا ڈھانپ ہٹا دِتا تے ویکھیا کہ زمین دا مُکھ سُک چکیا ہا."
  - verse: 14
    text: "دوجھے مہینے دے ستائیویں ݙینہے زمین پوری طرح سُک گئی."
  - verse: 15
    text: "تے خدا نے نوح نال آکھیا,"
  - verse: 16
    text: "'تُو کشتی وچوں باہر نکل, تُو, تیری بیوی, تیرے پتر, تے تیرے پتران دیاں زالاں تیرے نال.'"
  - verse: 17
    text: "'اپنے نال سارے گوشت وچوں ہر جیتی چیز, پرندے, مویشی, تے جیہڑی جیہڑی چیز زمین اُتے رینگدی اے, باہر کڈھ, تاں جو اوہ زمین وچ فراوانی نال پھیلن, پھلن تے وادن.'"
  - verse: 18
    text: "سو نوح باہر نکلیا, اوہدے پتر, اوہدی بیوی, تے اوہدے پتران دیاں زالاں اوہدے نال."
  - verse: 19
    text: "ہر جانور, ہر رینگن آلی چیز, تے ہر پرندہ, جیہڑا جیہڑا زمین اُتے ہِلدے پھِلدے نیں, اپنے اپنے خاندان مطابق کشتی تُوں باہر نکلے."
  - verse: 20
    text: "نوح نے خداوند لئی اک قربان گاہ بنائی, تے ہر پاک جانور تے ہر پاک پرندے وچوں لیا تے قربان گاہ اُتے سوختنی قربانیاں چڑھائیاں."
  - verse: 21
    text: "خداوند نے اوہ خوشگوار خوشبو سونگھی, تے خداوند نے اپنے دل وچ آکھیا: 'میں ہن ہور انسان دے سبب زمین نوں لعنتی نہ ٹھہراواں گا, کیوں جو انسان دے دل دے خیال بچپن تُوں ہی بدی دے نیں. میں ہن ہور جیہڑا جیہڑا جیتا اے اوہنوں وی ایویں نہ مارساں جیویں میں کیتا.'"
  - verse: 22
    text: "'جندھ تائیں زمین قائم اے, بوائی تے کٹائی, سردی تے گرمی, گرما تے سرما, دن تے رات, کدی نہ مُکن گے.'"
