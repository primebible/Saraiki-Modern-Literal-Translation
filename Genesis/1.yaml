book: "پیدائش"
chapter: 1
verses:
  - verse: 1
    text: "شروع وِچ خدا نے آسماناں تے زمین بنائے۔"
  - verse: 2
    text: "زمین بے صورت تے خالی ہا، تے ہنیرے گہرائی دے مُکھ تے ہا، تے خدا دی روح پانی دے مُکھ تے منڈلا ریا ہا۔"
  - verse: 3
    text: "ول خدا نے آکھیا: 'روشنی تھیوے'، تے روشنی تھی وئی۔"
  - verse: 4
    text: "خدا نے روشنی کوُ ڈِٹھا کہ اوہ چنگی ہِے، تے خدا نے روشنی کوُ ہنیرے توں وکھ کیتا۔"
  - verse: 5
    text: "خدا نے روشنی دا ناں دن رکھیا، تے ہنیرے دا ناں رات رکھیا۔ ول شام تے سویر تھی، پہلا ڈیں۔"
  - verse: 6
    text: "ول خدا نے آکھیا: 'پانی دے وچکار فضا تھیوے، تے اوہ پانی کوُ پانی توں وکھ کرے۔'"
  - verse: 7
    text: "چنانچہ خدا نے فضا بنائی، تے اوندے تھلے آلے پانی کوُ اوندے اُتے آلے پانی توں وکھ کیتا، تے ایویں تھی ویا۔"
  - verse: 8
    text: "خدا نے فضا دا ناں آسمان رکھیا۔ ول شام تے سویر تھی، ڈوجھا ڈیں۔"
  - verse: 9
    text: "ول خدا نے آکھیا: 'آسمان دے تھلے آلا پانی ہک تھاں تے اکٹھا تھیوے، تے خشکی ظاہر تھیوے'، تے ایویں تھی ویا۔"
  - verse: 10
    text: "خدا نے خشکی دا ناں زمین رکھیا، تے پانی دے اکٹھے ہوون کوُ سمندر آکھیا۔ تے خدا نے ڈِٹھا کہ ایہہ چنگا ہِے۔"
  - verse: 11
    text: "ول خدا نے آکھیا: 'زمین گھاس، بیج ڈیون آلی بوٹی، تے پھل دار درخت اپنی اپنی قسم دے موافق زمین تے اگاوے، جئیں دے پھل وِچ اوندے اندر بیج ہووے'، تے ایویں تھی ویا۔"
  - verse: 12
    text: "چنانچہ زمین نے گھاس اگائی، تے اوہ بوٹی جیہڑی بیج ڈیندی ہِے اپنی اپنی قسم دے موافق، تے اوہ درخت جیہڑا اپنے پھل وِچ بیج نال اپنی اپنی قسم دے موافق پھل ڈیندا ہِے۔ تے خدا نے ڈِٹھا کہ ایہہ چنگا ہِے۔"
  - verse: 13
    text: "ول شام تے سویر تھی، تیجھا ڈیں۔"
  - verse: 14
    text: "ول خدا نے آکھیا: 'آسمان دی فضا وِچ چانن ہوون تاں جو دن کوُ رات توں وکھ کرن، تے اوہ نشانیاں، موسماں، ڈیناں تے سالاں دے کیتے ہوون،"
  - verse: 15
    text: "تے آسمان دی فضا وِچ زمین تے چانن ڈیون'، تے ایویں تھی ویا۔"
  - verse: 16
    text: "چنانچہ خدا نے ڈوُ وڈے چانن بنائے: وڈا چانن دن تے راج کرن دے کیتے، تے چھوٹا چانن رات تے راج کرن دے کیتے۔ تے تارے وی بنائے۔"
  - verse: 17
    text: "خدا نے اُنہاں کوُ آسمان دی فضا وِچ ٹھہرایا تاں جو زمین تے چانن ڈیون،"
  - verse: 18
    text: "دن تے رات تے راج کرن، تے روشنی کوُ ہنیرے توں وکھ کرن۔ تے خدا نے ڈِٹھا کہ ایہہ چنگا ہِے۔"
  - verse: 19
    text: "ول شام تے سویر تھی، چوتھا ڈیں۔"
  - verse: 20
    text: "ول خدا نے آکھیا: 'پانی جانداراں نال فراوان طور تے بھر ونجے، تے پرندے زمین دے اُتے آسمان دی فضا دے مُکھ تے اُڈّن۔'"
  - verse: 21
    text: "چنانچہ خدا نے وڈے سمندری جانور، تے ہر اوہ جاندار، جنہاں نال پانی بھریا پئے، جیہڑے ہلدے پھلدے ہِن، اپنی اپنی قسم دے موافق، تے ہر پروں آلا پنچھی اپنی اپنی قسم دے موافق پیدا کیتا۔ تے خدا نے ڈِٹھا کہ ایہہ چنگا ہِے۔"
  - verse: 22
    text: "تے خدا نے اُنہاں کوُ برکت ڈِتی، آکھیا: 'پھلو تے وادو، سمندراں دے پانی بھرو، تے پرندے زمین تے وادھن۔'"
  - verse: 23
    text: "ول شام تے سویر تھی، پنجواں ڈیں۔"
  - verse: 24
    text: "ول خدا نے آکھیا: 'زمین اپنے قسم قسم دے جاندار پیدا کرے: مویشی، رینگن آلیاں چیزاں، تے زمین دے جنگلی جانور، ہر ہک اپنی اپنی قسم دے موافق'، تے ایویں تھی ویا۔"
  - verse: 25
    text: "چنانچہ خدا نے زمین دے جنگلی جانور اپنی اپنی قسم دے موافق، مویشی اپنی اپنی قسم دے موافق، تے ہر اوہ چیز جیہڑی زمین تے رینگدی ہِے اپنی اپنی قسم دے موافق بنائے۔ تے خدا نے ڈِٹھا کہ ایہہ چنگا ہِے۔"
  - verse: 26
    text: "ول خدا نے آکھیا: 'آؤ، اساں انسان کوُ اپنی صورت تے اپنی شبیہ دے موافق بنائیے؛ اوہ سمندر دی مچھلی، ہوا دے پرندے، مویشی، ساری زمین، تے ہر اوہ چیز تے جیہڑی زمین تے رینگدی ہِے، اختیار رکھّن۔'"
  - verse: 27
    text: "چنانچہ خدا نے انسان کوُ اپنی صورت وِچ پیدا کیتا؛ خدا دی صورت وِچ اوُں کوُ پیدا کیتا؛ نر تے مادہ اُنہاں کوُ پیدا کیتا۔"
  - verse: 28
    text: "ول خدا نے اُنہاں کوُ برکت ڈِتی تے آکھیا: 'پھلو تے وادو؛ زمین کوُ بھرو تے اوُں کوُ مسخر کرو؛ سمندر دی مچھلی، ہوا دے پرندے، تے ہر اوہ جاندار تے جیہڑا زمین تے ہلدا ہِے، حکمرانی کرو۔'"
  - verse: 29
    text: "ول خدا نے آکھیا: 'ڈیکھو، میں تُہاکوُ ہر اوہ بوٹی ڈِتی ہِے جیہڑی بیج ڈیندی ہِے جیہڑی ساری زمین دے مُکھ تے ہِے، تے ہر اوہ درخت جئیں دا پھل بیج رکھدا ہِے؛ ایہہ تہاڈی خوراک ہوسن۔"
  - verse: 30
    text: "تے زمین دے ہر جانور، ہوا دے ہر پرندے، تے ہر اوہ چیز جیہڑی زمین تے رینگدی ہِے، جنہاں وِچ جان ہِے، میں ہر سبز بوٹی خوراک دے کیتے ڈِتی ہِے'، تے ایویں تھی ویا۔"
  - verse: 31
    text: "تے خدا نے ساریاں چیزاں کوُ جیہڑیاں اوُں نے بنائیاں ہن ڈِٹھا، تے ڈیکھو، اوہ بہوں چنگیاں ہن۔ ول شام تے سویر تھی، چھٹھا ڈیں۔"
