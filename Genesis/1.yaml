book: "پیدائش"
chapter: 1
verses:
  - verse: 1
    text: "ابتدا وچ خدا نے آسماناں تے زمین بنائے۔"
  - verse: 2
    text: "زمین بے صورت تے خالی ہا، تے ہنیرے گہرائی دے مُکھ تے ہا، تے روحِ خدا پانیوں دے مُکھ تے منڈلا ریا ہا۔"
  - verse: 3
    text: "ول خدا نے آکھیا: 'روشنی ہووے'، تے روشنی تھی وئی۔"
  - verse: 4
    text: "خدا نے روشنی نوں ویکھیا کہ اوہ چنگی اے، تے خدا نے روشنی نوں ہنیرے توں وکھ کیتا۔"
  - verse: 5
    text: "خدا نے روشنی دا ناں دن رکھیا، تے ہنیرے دا ناں رات رکھیا۔ ول شام تے سویر تھی، پہلا ݙینہہ۔"
  - verse: 6
    text: "ول خدا نے آکھیا: 'پانیوں دے وچکار فضا ہووے، تے اوہ پانیوں نوں پانیوں توں وکھ کرے۔'"
  - verse: 7
    text: "سو خدا نے فضا بنائی، تے اوہدے تھلے آلے پانیوں نوں اوہدے اُتے آلے پانیوں توں وکھ کیتا، تے ایویں تھی ویا۔"
  - verse: 8
    text: "خدا نے فضا دا ناں آسمان رکھیا۔ ول شام تے سویر تھی، ݙوجھا ݙینہہ۔"
  - verse: 9
    text: "ول خدا نے آکھیا: 'آسماناں دے تھلے آلے پانی اک تھاں تے اکٹھے ہوون، تے خشکی ظاہر تھیوے'، تے ایویں تھی ویا۔"
  - verse: 10
    text: "خدا نے خشکی دا ناں زمین رکھیا، تے پانیوں دے اکٹھے ہون نوں سمندراں آکھیا۔ تے خدا نے ویکھیا کہ ایہ چنگا اے۔"
  - verse: 11
    text: "ول خدا نے آکھیا: 'زمین گھاس، بیج دیندی بوٹی، تے پھل دار درخت اپنی اپنی قسم مطابق زمین اُتے اگاوے، جیہڑے دے پھل وچ اوہدے اندر بیج ہووے'، تے ایویں تھی ویا۔"
  - verse: 12
    text: "سو زمین نے گھاس اگائی، تے اوہ بوٹی جیہڑی بیج دیندی اے اپنی اپنی قسم مطابق، تے اوہ درخت جیہڑا اپنے پھل وچ بیج نال اپنی اپنی قسم مطابق پھل دیندا اے۔ تے خدا نے ویکھیا کہ ایہ چنگا اے۔"
  - verse: 13
    text: "ول شام تے سویر تھی، تیجھا ݙینہہ۔"
  - verse: 14
    text: "ول خدا نے آکھیا: 'آسمان دی فضا وچ چانن ہوون تاں جو دن نوں رات توں وکھ کرن، تے اوہ نشانیوں، موسموں، دن تے سالاں واسطے ہوون،"
  - verse: 15
    text: "تے آسمان دی فضا وچ زمین اُتے چانن دیون'، تے ایویں تھی ویا۔"
  - verse: 16
    text: "سو خدا نے دو وڈے چانن بنائے: وڈا چانن دن اُتے راج کرن واسطے، تے چھوٹا چانن رات اُتے راج کرن واسطے۔ تے ستارے وی بنائے۔"
  - verse: 17
    text: "خدا نے اوہناں نوں آسمان دی فضا وچ ٹھہرایا تاں جو زمین اُتے چانن دیون،"
  - verse: 18
    text: "دن تے رات اُتے راج کرن، تے روشنی نوں ہنیرے توں وکھ کرن۔ تے خدا نے ویکھیا کہ ایہ چنگا اے۔"
  - verse: 19
    text: "ول شام تے سویر تھی، چوتھا ݙینہہ۔"
  - verse: 20
    text: "ول خدا نے آکھیا: 'پانی جانداراں نال فراوان طور تے بھر جاون، تے پرندے زمین دے اُتے آسمان دی فضا دے مُکھ تے اُڈّن۔'"
  - verse: 21
    text: "سو خدا نے وڈے سمندری جانور، تے ہر اوہ جاندار، جِنہاں نال پانی بھریا پیا اے، جیہڑے ہِلدے پھِلدے نیں، اپنی اپنی قسم مطابق، تے ہر پروں آلا پنچھی اپنی اپنی قسم مطابق پیدا کیتا۔ تے خدا نے ویکھیا کہ ایہ چنگا اے۔"
  - verse: 22
    text: "تے خدا نے اوہناں نوں برکت دِتی، آکھیا: 'پھلو تے وادو، سمندراں دے پانی بھرو، تے پرندے زمین اُتے وادھن۔'"
  - verse: 23
    text: "ول شام تے سویر تھی، پنجواں ݙینہہ۔"
  - verse: 24
    text: "ول خدا نے آکھیا: 'زمین اپنے قسم قسم دے جاندار پیدا کرے: مویشی، رینگن آلیاں چیزاں، تے زمین دے جنگلی جانور، ہر اک اپنی اپنی قسم مطابق'، تے ایویں تھی ویا۔"
  - verse: 25
    text: "سو خدا نے زمین دے جنگلی جانور اپنی اپنی قسم مطابق، مویشی اپنی اپنی قسم مطابق، تے ہر اوہ چیز جیہڑی زمین اُتے رینگدی اے اپنی اپنی قسم مطابق بنائے۔ تے خدا نے ویکھیا کہ ایہ چنگا اے۔"
  - verse: 26
    text: "ول خدا نے آکھیا: 'آؤ، اسی انسان نوں اپنی صورت تے اپنی شبیہ مطابق بنائیے؛ اوہ سمندر دی مچھلی، ہوا دے پرندے، مویشی، ساری زمین، تے ہر اوہ چیز اُتے جیہڑی زمین اُتے رینگدی اے، اختیار رکھّن۔'"
  - verse: 27
    text: "سو خدا نے انسان نوں اپنی صورت وچ پیدا کیتا؛ خدا دی صورت وچ اوہنوں پیدا کیتا؛ نر تے مادہ اوہناں نوں پیدا کیتا۔"
  - verse: 28
    text: "ول خدا نے اوہناں نوں برکت دِتی تے آکھیا: 'پھلو تے وادو؛ زمین نوں بھرو تے اوہنوں مسخر کرو؛ سمندر دی مچھلی، ہوا دے پرندے، تے ہر اوہ جاندار اُتے جیہڑا زمین اُتے ہِلدا اے، حکمرانی کرو۔'"
  - verse: 29
    text: "ول خدا نے آکھیا: 'ویکھو، میں تُہانوں ہر اوہ بوٹی دِتی اے جیہڑی بیج دیندی اے جیہڑی ساری زمین دے مُکھ اُتے اے، تے ہر اوہ درخت جیہڑے دا پھل بیج رکھدا اے؛ ایہ تُہانڑی خوراک ہون گے۔"
  - verse: 30
    text: "تے زمین دے ہر جانور، ہوا دے ہر پرندے، تے ہر اوہ چیز جیہڑی زمین اُتے رینگدی اے، جِنہاں وچ جان اے، میں ہر سبز بوٹی خوراک واسطے دِتی اے'، تے ایویں تھی ویا۔"
  - verse: 31
    text: "تے خدا نے ساریاں چیزاں نوں جیہڑیاں اوہنے بنائیاں سن ویکھیا، تے ویکھو، اوہ بہت چنگیاں سن۔ ول شام تے سویر تھی، چھٹها ݙینہہ۔"
