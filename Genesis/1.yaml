book: "پیدائش"
chapter: 1
verses:
  - verse: 1
    text: "شروع وِچ خدا نے آسماناں تے زمین پیدا کیتن۔"
  - verse: 2
    text: "زمین بے صورت تے خالی ہئی، تے گہرائی دی سطح اُتے ہنیرا ہا؛ تے خدا دی روح پاݨیاں دی سطح اُتے منڈلا رہی ہئی۔"
  - verse: 3
    text: "ول خدا نے آکھیا: روشنی تھیوے؛ تے روشنی تھی ڳئی۔"
  - verse: 4
    text: "تے خدا نے روشنی کُوں ݙِٹھا کہ اوہ چنڳی ہئی؛ تے خدا نے روشنی کُوں ہنیرے توں وکھ کیتا۔"
  - verse: 5
    text: "تے خدا نے روشنی دا ناں ݙینہہ رکھیا، تے ہنیرے دا ناں رات رکھیا۔ ول شام تھی تے سویر تھی، ہک ݙینہہ۔"
  - verse: 6
    text: "ول خدا نے آکھیا: پاݨیاں دے وچکار ہک فضا تھیوے، تے اوہ پاݨیاں کُوں پاݨیاں توں وکھ کرے۔"
  - verse: 7
    text: "تے خدا نے فضا بݨائی، تے فضا دے تھلے آلے پاݨیاں کُوں فضا دے اُتے آلے پاݨیاں توں وکھ کیتا؛ تے ایویں تھی ڳیا۔"
  - verse: 8
    text: "تے خدا نے فضا دا ناں آسمان رکھیا۔ ول شام تھی تے سویر تھی، ݙوجھا ݙینہہ۔"
  - verse: 9
    text: "ول خدا نے آکھیا: آسمان دے تھلے آلا پاݨی ہک تھاں تے اکٹھا تھیوے، تے خشکی ظاہر تھیوے؛ تے ایویں تھی ڳیا۔"
  - verse: 10
    text: "تے خدا نے خشکی دا ناں زمین رکھیا، تے پاݨیاں دے اکٹھ کُوں سمندراں آکھیا؛ تے خدا نے ݙِٹھا کہ ایہہ چنڳا ہا۔"
  - verse: 11
    text: "ول خدا نے آکھیا: زمین سبزہ اگاوے؛ بیج ݙیوݨ آلیاں بوٹیاں، تے پھلدار درخت جیہڑے اپݨی اپݨی قسم دے مطابق پھل ݙیوݨ تے جنھاں دے پھل وِچ بیج ہووے؛ تے ایویں تھی ڳیا۔"
  - verse: 12
    text: "تے زمین نے سبزہ اگایا؛ اپݨی اپݨی قسم دے مطابق بیج ݙیوݨ آلیاں بوٹیاں، تے اپݨی اپݨی قسم دے مطابق اوہ درخت جنھاں دے پھل وِچ بیج ہا؛ تے خدا نے ݙِٹھا کہ ایہہ چنڳا ہا۔"
  - verse: 13
    text: "ول شام تھی تے سویر تھی، تریجھا ݙینہہ۔"
  - verse: 14
    text: "ول خدا نے آکھیا: آسمان دی فضا وِچ چانݨ ہووݨ تاں جو ݙینہہ کُوں رات توں وکھ کرن؛ تے اوہ نشانیاں، مقررہ ویلاں، ݙینہاں تے سالاں دے کیتے ہووݨ؛"
  - verse: 15
    text: "تے اوہ آسمان دی فضا وِچ چانݨ ہووݨ تاں جو زمین اُتے روشنی ݙیوݨ؛ تے ایویں تھی ڳیا۔"
  - verse: 16
    text: "تے خدا نے ݙو وݙے چانݨ بݨائے: وݙا چانݨ ݙینہہ اُتے راڄ کرݨ دے کیتے، تے نِکّا چانݨ رات اُتے راڄ کرݨ دے کیتے؛ تے تارے وی بݨائے۔"
  - verse: 17
    text: "تے خدا نے اُنہاں کُوں آسمان دی فضا وِچ رکھیا تاں جو زمین اُتے روشنی ݙیوݨ؛"
  - verse: 18
    text: "ݙینہہ تے رات اُتے راڄ کرن، تے روشنی کُوں ہنیرے توں وکھ کرن؛ تے خدا نے ݙِٹھا کہ ایہہ چنڳا ہا۔"
  - verse: 19
    text: "ول شام تھی تے سویر تھی، چوتھا ݙینہہ۔"
  - verse: 20
    text: "ول خدا نے آکھیا: پاݨی جیتیاں جاناں نال لبالب بھر ونڄے، تے پرندے زمین دے اُتے آسمان دی کھلی فضا وِچ اُݙّن۔"
  - verse: 21
    text: "تے خدا نے وݙے سمندری جاندار پیدا کیتن، تے پاݨیاں وِچ ہلݨ جلݨ آلی ہر جیتی جان اپݨی اپݨی قسم دے مطابق، تے ہر پروں آلا پرندہ اپݨی اپݨی قسم دے مطابق پیدا کیتا؛ تے خدا نے ݙِٹھا کہ ایہہ چنڳا ہا۔"
  - verse: 22
    text: "تے خدا نے اُنہاں کُوں برکت ݙِتی تے آکھیا: پھلو تے ودھو، سمندراں دے پاݨیاں کُوں بھرو، تے پرندے زمین اُتے ودھݨ۔"
  - verse: 23
    text: "ول شام تھی تے سویر تھی، پنجواں ݙینہہ۔"
  - verse: 24
    text: "ول خدا نے آکھیا: زمین اپݨی اپݨی قسم دے مطابق جیتیاں جاناں پیدا کرے؛ مویشی، زمین اُتے رینگݨ آلیاں چیزاں، تے جنگلی جانور، ہر ہک اپݨی اپݨی قسم دے مطابق؛ تے ایویں تھی ڳیا۔"
  - verse: 25
    text: "تے خدا نے جنگلی جانور اپݨی اپݨی قسم دے مطابق، مویشی اپݨی اپݨی قسم دے مطابق، تے زمین اُتے رینگݨ آلی ہر شئے اپݨی اپݨی قسم دے مطابق بݨائے؛ تے خدا نے ݙِٹھا کہ ایہہ چنڳا ہا۔"
  - verse: 26
    text: "ول خدا نے آکھیا: آؤ، اساں انسان کُوں اپݨی صورت وِچ، اپݨی شبیہ دے مطابق بݨائیے؛ تے اوہ سمندر دیاں مچھیاں، آسمان دے پرندیاں، مویشیاں، ساری زمین، تے زمین اُتے رینگݨ آلی ہر شئے اُتے راڄ کرن۔"
  - verse: 27
    text: "تے خدا نے انسان کُوں اپݨی صورت وِچ پیدا کیتا؛ خدا دی صورت وِچ اُوں کُوں پیدا کیتا؛ نر تے مادہ اُنہاں کُوں پیدا کیتا۔"
  - verse: 28
    text: "تے خدا نے اُنہاں کُوں برکت ݙِتی، تے خدا نے اُنہاں کُوں آکھیا: پھلو تے ودھو، زمین کُوں بھرو تے اوندے اُتے قابو پاؤ؛ سمندر دیاں مچھیاں، آسمان دے پرندیاں، تے زمین اُتے ہلݨ آلی ہر جیتی جان اُتے راڄ کرو۔"
  - verse: 29
    text: "تے خدا نے آکھیا: ݙیکھو، میں تُہاکُوں ہر بیج ݙیوݨ آلی بوٹی ݙِتی ہِے جیہڑی ساری زمین دی سطح اُتے ہِے، تے ہر اوہ درخت جین٘دے پھل وِچ بیج ہِے؛ ایہہ تُہاݙی خوراک ہوسی۔"
  - verse: 30
    text: "تے زمین دے ہر جانور کُوں، آسمان دے ہر پرندے کُوں، تے زمین اُتے رینگݨ آلی ہر شئے کُوں، جنھاں وِچ جیتی جان ہِے، میں ہر ہری بوٹی خوراک دے کیتے ݙِتی ہِے؛ تے ایویں تھی ڳیا۔"
  - verse: 31
    text: "تے خدا نے سارا کجھ جیہڑا اُوں نے بݨایا ہا ݙِٹھا، تے ݙیکھو، اوہ ٻہوں چنڳا ہا۔ ول شام تھی تے سویر تھی، چھٹھا ݙینہہ۔"
