book: "پیدائش"
chapter: 10
verses:
  - verse: 1
    text: "ایہ نوح دے پتراں سام, حام, تے یافث دیاں نسلاں دی سرگزشت اے. سیلاب دے بعد اوہناں نوں پتر جمے."
  - verse: 2
    text: "یافث دے پتر جومر, ماجوج, مادای, یاوان, توبل, میسک, تے تیراس سن."
  - verse: 3
    text: "جومر دے پتر اشکناز, ریفت, تے توجرمہ سن."
  - verse: 4
    text: "یاوان دے پتر الیشاہ, ترشیش, کتییم, تے دودانیم سن."
  - verse: 5
    text: "ایہناں تھوں قوماں دے جزیرے اوہناں دیاں زمیناں وچ ونڈے گئے, ہر اک اپنی زبان, اپنے اپنے خاندان, اپنی اپنی قوم مطابق."
  - verse: 6
    text: "حام دے پتر کوش, مصرایم, فوط, تے کنعان سن."
  - verse: 7
    text: "کوش دے پتر سبا, حویلہ, سبتہ, رعما, تے سبتکہ سن. رعما دے پتر شبا تے ددان سن."
  - verse: 8
    text: "کوش تھوں نمرود جمیا. اوہ زمین اُتے پہلا زورآور ہویا."
  - verse: 9
    text: "اوہ خداوند دے سامنے زورآور شکاری ہا. ایس واسطے آکھیا ویندا اے: 'نمرود وانگ, خداوند دے سامنے زورآور شکاری.'"
  - verse: 10
    text: "اوہدی بادشاہی دی شروعات بابل, ارک, اکد, تے کلنہ سن, شنعار دی زمین وچ."
  - verse: 11
    text: "اوتّھوں اوہ آشور ول نکلیا, تے نینوا, رحوبوت عیر, تے کلح بنائے."
  - verse: 12
    text: "تے نینوا تے کلح دے وچکار ریسن ہا; ایہے اوہ وڈا شہر اے."
  - verse: 13
    text: "مصرایم تھوں لودیم, عنامیم, لہابیم, تے نفتوحیم جمے."
  - verse: 14
    text: "تے فتروسیم, کسلحیم (جیہڑیاں تھوں فلسطی نکلے), تے کفتوریم جمے."
  - verse: 15
    text: "کنعان تھوں صیدون, اوہدا پہلا پتر, تے حِتھ جمے."
  - verse: 16
    text: "تے یبوسی, اموری, جرجاسی,"
  - verse: 17
    text: "حوی, عرکی, سینی,"
  - verse: 18
    text: "اروادی, صماری, تے حماتی جمے. بعد وچ کنعانی خاندان پھیل گئے."
  - verse: 19
    text: "کنعانی سرحد صیدون تھوں جیرار ول, گزہ تک, تے سدوم, عمورہ, ادمہ, تے صبوئیم تھوں لاشع تک سی."
  - verse: 20
    text: "ایہ حام دے پتر نیں, اپنے اپنے خاندان, اپنی اپنی زبان, اپنی اپنی زمین, تے اپنی اپنی قوم مطابق."
  - verse: 21
    text: "سام نوں وی پتر جمے, جو یافث دا وڈا بھرا اے, تے عیبر دے سارے پتراں دا باپ اے."
  - verse: 22
    text: "سام دے پتر عیلم, آشور, ارفکشد, لود, تے آرام سن."
  - verse: 23
    text: "آرام دے پتر عوص, حول, جاثر, تے ماش سن."
  - verse: 24
    text: "ارفکشد تھوں شیلح جمیا, تے شیلح تھوں عیبر جمیا."
  - verse: 25
    text: "عیبر تھوں دو پتر جمے. اک دا ناں فالج ہا, کیوں جو اوہدے دناں وچ زمین ونڈے گئی. اوہدے بھرا دا ناں یقطان ہا."
  - verse: 26
    text: "یقطان تھوں الموداد, شالف, حضرموت, تے یارح جمے."
  - verse: 27
    text: "تے ہدورام, اوزال, تے دیقلہ جمے."
  - verse: 28
    text: "تے عوبال, ابیمال, تے سبا جمے."
  - verse: 29
    text: "تے اوفیر, حویلہ, تے یوباب جمے. ایہ سارے یقطان دے پتر سن."
  - verse: 30
    text: "اوہناں دا رہن سہن میشاہ تھوں سفار تک ہا, جو مشرق والا پہاڑ اے."
  - verse: 31
    text: "ایہ سام دے پتر نیں, اپنے اپنے خاندان, اپنی اپنی زبان, اپنی اپنی زمین, تے اپنی اپنی قوم مطابق."
  - verse: 32
    text: "ایہ نوح دے پتراں دیاں خاندان نیں, اپنی اپنی نسل, اپنی اپنی قوم مطابق. سیلاب دے بعد ایہناں تھوں قوماں زمین اُتے ونڈیاں گئیاں."
