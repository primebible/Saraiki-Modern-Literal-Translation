book: "پیدائش"
chapter: 9
verses:
  - verse: 1
    text: "تے خدا نے نوح تے اوہدے پتراں نوں برکت دِتی, تے اوہناں نال آکھیا: 'تُسی پھلو تے وادو, تے زمین نوں بھرو.'"
  - verse: 2
    text: "'تُہاڈا ڈر تے تُہاڈی ہیبت زمین دے ہر جانور, آسمان دے ہر پرندے, زمین اُتے ہِلدی پھِلدی ہر چیز, تے سمندر دی ساری مچھلی اُتے ہو سی; اوہ سارے تُہاڈے ہتھ وچ دِتے گئے نیں.'"
  - verse: 3
    text: "'ہر ہلن والی جیتی چیز تُہاڈے لئی خوراک ہو سی; جیویں میں تُہاڈے نوں سبز بوٹی دِتی ہئی, اوہویں ہن میں تُہاڈے نوں سارے کجھ دِتا اے.'"
  - verse: 4
    text: "'پر جیہڑا گوشت اوہدے جان نال ہووے, یعنی اوہدے خون نال, تُسی نہ کھاؤ.'"
  - verse: 5
    text: "'تے یقیناً میں ہر جان دے خون دا حساب منگساں; ہر جانور دے ہتھ تُوں میں اوہ منگساں, تے انسان دے ہتھ تُوں وی. ہر انسان دے بھرا دے ہتھ تُوں میں انسان دی جان منگساں.'"
  - verse: 6
    text: "'جیہڑا انسان دا خون بہاوے, اوہدے خون نوں انسان دے ہتھ نال بہایا ویسی, کیوں جو خدا نے انسان نوں اپنی صورت وچ بݨایا اے.'"
  - verse: 7
    text: "'تے تُسی پھلو تے وادو; زمین اُتے فراوانی نال وادھو, تے اوہدے وچ گھنو.'"
  - verse: 8
    text: "پھر خدا نے نوح تے اوہدے نال ہوندے پتراں نال آکھیا,"
  - verse: 9
    text: "'ویکھو, میں اپنا عہد تُہاڈے نال, تے تُہاڈی نسل نال, جیہڑی تُہاڈے پچھوں ہو سی, قائم کرناں.'"
  - verse: 10
    text: "'تے ہر جیتی مخلوق نال وی جو تُہاڈے نال اے: پرندے, مویشی, تے زمین دے سارے جانور, جیہڑے تُہاڈے نال کشتی تُوں باہر نکلے, یعنی زمین دے ہر جانور نال.'"
  - verse: 11
    text: "'میں اپنا عہد تُہاڈے نال قائم کراں گا کہ ہن تُوں سیلاب دے پانی نال ہور کوئی بشر کٹ نہ کیتا جا سی, تے ہن تُوں زمین نوں تباہ کرݨ لئی سیلاب نہ ہو سی.'"
  - verse: 12
    text: "تے خدا نے آکھیا: 'ایہ اوہ نشان اے اوہدے عہد دا, جیہڑا میں اپنے تے تُہاڈے تے ہر جیتی مخلوق جیہڑی تُہاڈے نال اے دے وچکار بݨا ریا واں, نسل در نسل لئی.'"
  - verse: 13
    text: "'میں بادل وچ اپنی قوس قزح رکھ دِتی اے, تے اوہ میرے تے زمین دے وچکار عہد دا نشان ہو سی.'"
  - verse: 14
    text: "'جیں ویلے میں زمین اُتے بادل لیاواں گا, تے قوس قزح بادل وچ نظر آ سی,'"
  - verse: 15
    text: "'تاں میں اپنا عہد یاد کراں گا, جو میرے تے تُہاڈے تے ہر جیتی مخلوق, ساری بشر وچ, دے وچکار اے; تے پانی ہور کدی وی ساری بشر نوں تباہ کرݨ لئی سیلاب نہ بݨن گے.'"
  - verse: 16
    text: "'قوس قزح بادل وچ ہو سی, تے میں اوہدے ول ویکھاں گا, تاں جو خدا تے ہر جیتی مخلوق, ساری بشر وچ, دے وچکار اوہ ہمیشہ دا عہد یاد کراں جیہڑا زمین اُتے اے.'"
  - verse: 17
    text: "تے خدا نے نوح نوں آکھیا: 'ایہ اوہ نشان اے عہد دا, جیہڑا میں اپنے تے زمین اُتے ساری بشر دے وچکار قائم کیتا اے.'"
  - verse: 18
    text: "نوح دے جیہڑے پتر کشتی تُوں باہر نکلے, اوہ سام, حام, تے یافث سن. حام کنعان دا باپ اے."
  - verse: 19
    text: "ایہ تینوں نوح دے پتر سن, تے ایہناں تھوں ساری زمین دے لوک پھیل گئے."
  - verse: 20
    text: "نوح نے زمینداری شروع کیتی, تے انگور دا باغ لگایا."
  - verse: 21
    text: "اوہنے اوہدے انگور دی شراب پی تے مست ہو گیا, تے اپنے خیمے وچ ننگا پیا ہا."
  - verse: 22
    text: "حام, جو کنعان دا باپ اے, نے اپنے پئیو دی ننگیائی ویکھی, تے باہر جا کے اپنے دوہاں بھراں نوں آکھ دِتا."
  - verse: 23
    text: "تاں سام تے یافث نے اک چادر لئی, اوہنوں اپنے دوہاں موڈھیاں اُتے رکھیا, تے پُٹھے مُڑ کے اندر گئے, تے اپنے پئیو دی ننگیائی ڈھانپ دِتی. اوہناں دے منہ پُٹھے سن, تے اوہناں نے اپنے پئیو دی ننگیائی نہ ویکھی."
  - verse: 24
    text: "نوح اپنی شراب تُوں ہوش وچ آیا, تے اوہنوں پتا لگیا کہ اوہدے چھوٹے پتر نے اوہدے نال کیا کیتا اے."
  - verse: 25
    text: "تے اوہنے آکھیا: 'کنعان لعنتی ہووے; اوہ اپنے بھراں لئی غلاماں دا غلام ہو سی.'"
  - verse: 26
    text: "تے اوہنے پھر آکھیا: 'سام دا خدا خداوند مبارک ہووے; تے کنعان اوہدے لئی غلام ہووے.'"
  - verse: 27
    text: "'خدا یافث نوں فراخ کرے; تے اوہ سام دے ڈیرے وچ وسے; تے کنعان اوہدے لئی وی غلام ہووے.'"
  - verse: 28
    text: "سیلاب دے بعد نوح 350 سال جئے."
  - verse: 29
    text: "نوح دے سارے دن 950 سال ہوئے, ول اوہ مر گیا."
