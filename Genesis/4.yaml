book: "پیدائش"
chapter: 4
verses:
  - verse: 1
    text: "ول آدم نے اپنی بیوی حوّا نوں جانیا؛ اوہ حاملہ تھی گئی تے اوہنے قائن ناں دا پتر جمیا، تے آکھیا: 'میں خداوند دی مدد نال اک مرد حاصل کیتا اے.'"
  - verse: 2
    text: "ول اوہنے قائن دے بھرا ہابیل نوں جمیا۔ ہابیل بھیڑاں دا رکھوالا ہا، تے قائن زمین نوں جوتݨ آلا ہا۔"
  - verse: 3
    text: "کجھ عرصہ پچھوں، قائن نے زمین دے پھل وچوں خداوند لئی نذرانہ لے آیا۔"
  - verse: 4
    text: "ہابیل وی اپنے ریوڑ دے پہلوٹھیاں وچوں تے اوہناں دے چربی دے حصیاں وچوں کجھ لے آیا؛ تے خداوند نے ہابیل تے اوہدے نذرانے نوں قبول کیتا۔"
  - verse: 5
    text: "پر قائن تے اوہدے نذرانے نوں قبول نہ کیتا۔ سو قائن بہُت غصے وچ آیا، تے اوہدے مُکھ اُتر گیا۔"
  - verse: 6
    text: "خداوند نے قائن نوں آکھیا: 'تُوں کیوں غصے وچ آہیں؟ تے تیرا مُکھ کیوں اُتر گیا؟'"
  - verse: 7
    text: "'جے تُوں چنگا کریں، کیا قبول نہ تھی سی؟ جے تُوں چنگا نہ کریں، تے گناہ دروازے تے گھات لایا بیٹھا اے؛ اوہدی خواہش تیرے لئی اے، پر تُوں اوہدے اُتے راج کر.'"
  - verse: 8
    text: "قائن نے اپنے بھرا ہابیل نوں آکھیا: 'چلو کھیت وچ چلئیے۔' جِیویں اوہ کھیت وچ سن، قائن اپنے بھرا ہابیل دے خلاف اٹھیا تے اوہنوں قتل کیتا۔"
  - verse: 9
    text: "خداوند نے قائن نوں آکھیا: 'تیرا بھرا ہابیل کتھے اے؟' اوہ آکھیا: 'میں نئیں جاندا۔ کیا میں اپنے بھرا دا رکھوالا آں؟'"
  - verse: 10
    text: "خداوند نے آکھیا: 'تُوں کیا کیتا؟ تیرے بھرا دے خون دی آواز زمین تُوں مینوں پکاردی اے۔'"
  - verse: 11
    text: "اس واسطے ہُن تُو زمین تُوں لعنتی ٹھہریا اے، جیہڑی نے اپنا منہ کھول کے تیرے ہتھ تُوں تیرے بھرا دا خون اپنے اندر لے لیا۔"
  - verse: 12
    text: "جد تُوں زمین نوں جوتیں گا، اوہ تیرے لئی اپنی طاقت نہ دیسی؛ تُو زمین وچ بھاگن آلا تے آوارہ پھرن آلا ویسی۔"
  - verse: 13
    text: "قائن نے خداوند نال آکھیا: 'میری سزا برداشت توں ودھ اے۔'"
  - verse: 14
    text: "ویکھ، تُسیں اج مینوں زمین دے مُکھ تُوں کڈھ دِتا اے؛ میں تیری حضوری تُوں لُکساں، تے زمین وچ آوارہ تے بھٹکن آلا ہوواں گا؛ جیہڑا وی مینوں لبھے گا اوہ مینوں مار سی۔'"
  - verse: 15
    text: "تے خداوند نے اوہدے نوں آکھیا: 'ایس واسطے جو کوئی قائن نوں مارے، اوہدے اُتے سات گنا بدلہ لیا ویسی۔' تے خداوند نے قائن لئی اک نشان ٹھہرایا تاں جو جیہڑا کوئی اوہنوں لبھے اوہ اوہدے اُتے وار نہ کرے۔"
  - verse: 16
    text: "پھر قائن خداوند دی حضوری تُوں نکل گیا، تے عدن دے مشرق ول نود دی زمین وچ وسیا۔"
  - verse: 17
    text: "قائن نے اپنی بیوی نوں جانیا؛ اوہ حاملہ تھی گئی تے اوہنے حنوک نوں جمیا۔ ول اوہنے اک شہر بݨایا تے اوہدے ناں اپنے پتر حنوک دے ناں تے رکھیا۔"
  - verse: 18
    text: "حنوک تھوں عیراد جمیا؛ عیراد تھوں محوی ایل جمیا؛ محوی ایل تھوں متوشایل جمیا؛ متوشایل تھوں لامک جمیا۔"
  - verse: 19
    text: "لامک نے دو زالاں نال ویاہ کیتا: اک دا ناں عدہ ہا، تے دوجھی دا ناں صلہ ہا۔"
  - verse: 20
    text: "عدہ نوں یابل جمیا؛ اوہ اوہناں دا باپ ہا جیہڑے ڈیرے وچ وسندے تے مویشی پالندے نیں۔"
  - verse: 21
    text: "اوہدے بھرا دا ناں یوبل ہا؛ اوہ اوہناں ساریاں دا باپ ہا جیہڑے ستار تے بانسری چلاندے نیں۔"
  - verse: 22
    text: "صلہ نوں توبل قائن جمیا، جیہڑا تانبا تے لوہے دے ہر تیز ہتھیار دا بنانے آلا ہا؛ توبل قائن دی بہن نعمہ ہئی۔"
  - verse: 23
    text: "لامک نے اپنی زالاں نوں آکھیا: 'عدہ تے صلہ، میری آواز سُنو؛ اے لامک دیاں زالاں، میری گل تے دھیان دیو: میں اک مرد نوں مار ݙتا کیوں جو اوہنے مینوں زخمی کیتا؛ اک جوان نوں اس واسطے کہ اوہنے مینوں چوٹ ماری۔'"
  - verse: 24
    text: "'جے قائن لئی سات گنا بدلا اے، تاں لامک لئی ستتّر گنا۔'"
  - verse: 25
    text: "ول آدم نے اپنی بیوی نوں جانیا؛ اوہنے اک پتر جمیا تے اوہدے ناں شیث رکھیا، آکھدی: 'کیوں جو خدا نے ہابیل دے بدلے مینوں ہک ہور پتر دِتا اے، کیوں جو قائن اوہنوں مار دِتا۔'"
  - verse: 26
    text: "شیث نوں وی اک پتر جمیا تے اوہدے ناں انوش رکھیا۔ اوہے ویلے لوکاں نے خداوند دے ناں نوں پکارݨ شروع کیتا۔"
