book: "پیدائش"
chapter: 11
verses:
  - verse: 1
    text: "ساری زمین دے لوک اک زبان تے اک بولی رکھدے سن."
  - verse: 2
    text: "تے جیں جیں اوہ مشرق ول تُردے پئے سن, اوہناں نوں شنعار دی زمین وچ اک میدان لبھیا, تے اوہ اتّھے وس گئے."
  - verse: 3
    text: "اوہناں اک دوجے نال آکھیا: 'آؤ, اسی اینٹاں بݨائیے تے اوہناں نوں چنگی طرح پکا لیئے.' اوہناں کول پتھر دی تھاں اینٹ ہئی, تے اوہناں گارے لئی قیر ورتی."
  - verse: 4
    text: "اوہناں آکھیا: 'آؤ, اسی اپنے لئی اک شہر تے اک منار بݨائیے, جیہڑا دا سرا آسمان تک پہنچے; تے آؤ, اپنے لئی ناں بݨائیے, کدھرے ایسا نہ ہووے جو اسی ساری زمین دے مُکھ اُتے چؤفیرے ونڈ ونجیئے.'"
  - verse: 5
    text: "تے خداوند اوہ شہر تے اوہ منار ویکھݨ لئی تھلے آیا, جیہڑا بنی آدم بݨا رہے سن."
  - verse: 6
    text: "تے خداوند نے آکھیا: 'ویکھو, ایہ اک قوم نیں, تے سارے اک زبان آلے نیں; تے ایہ اوہ کم اے جیہڑا اوہ شروع کیتا اے. ہن اوہناں لئی کوئی گل ناممکن نہیں رہسی, جیہڑی اوہ کرݨ دا ارادہ کرن گے.'"
  - verse: 7
    text: "'آؤ, اسی تھلے ونجیئے, تے اوتّھے اوہناں دی زبان گڈ مڈ کر دیئے, تاں جو اوہ اک دوجے دی گل نہ سمجھن.'"
  - verse: 8
    text: "سو خداوند نے اوہناں نوں اوتّھوں ساری زمین دے مُکھ اُتے چؤفیرے ونڈ دِتا, تے اوہناں شہر بݨانا چھوڑ دِتا."
  - verse: 9
    text: "ایس واسطے اوہدے دا ناں بابل پیا, کیوں جو اتّھے خداوند نے ساری زمین دی زبان گڈ مڈ کر دِتی. تے اتّھے تھوں خداوند نے اوہناں نوں ساری زمین دے مُکھ اُتے چؤفیرے ونڈ دِتا."
  - verse: 10
    text: "ایہ سام دیاں نسلاں دی سرگزشت اے: سام سو سال دا ہا, تے سیلاب توں دو سال بعد اوہدے تھوں ارفکشد جمیا."
  - verse: 11
    text: "ارفکشد دا پیو ہون توں بعد سام نے 500 سال جئے, تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 12
    text: "ارفکشد نے 35 سال جئے, ول ارفکشد تھوں شیلح جمیا."
  - verse: 13
    text: "ول شیلح دا پیو ہون توں بعد ارفکشد نے 403 سال جئے, تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 14
    text: "شیلح نے 30 سال جئے, ول شیلح تھوں عیبر جمیا."
  - verse: 15
    text: "ول عیبر دا پیو ہون توں بعد شیلح نے 403 سال جئے, تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 16
    text: "عیبر نے 34 سال جئے, ول عیبر تھوں فالج جمیا."
  - verse: 17
    text: "ول فالج دا پیو ہون توں بعد عیبر نے 430 سال جئے, تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 18
    text: "فالج نے 30 سال جئے, ول فالج تھوں رعو جمیا."
  - verse: 19
    text: "ول رعو دا پیو ہون توں بعد فالج نے 209 سال جئے, تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 20
    text: "رعو نے 32 سال جئے, ول رعو تھوں سروج جمیا."
  - verse: 21
    text: "ول سروج دا پیو ہون توں بعد رعو نے 207 سال جئے, تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 22
    text: "سروج نے 30 سال جئے, ول سروج تھوں نحور جمیا."
  - verse: 23
    text: "ول نحور دا پیو ہون توں بعد سروج نے 200 سال جئے, تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 24
    text: "نحور نے 29 سال جئے, ول نحور تھوں تارح جمیا."
  - verse: 25
    text: "ول تارح دا پیو ہون توں بعد نحور نے 119 سال جئے, تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 26
    text: "تارح نے 70 سال جئے, ول تارح تھوں ابرام, نحور, تے حران جمے."
  - verse: 27
    text: "ہن ایہ تارح دیاں نسلاں دی سرگزشت اے: تارح تھوں ابرام, نحور, تے حران جمے. حران تھوں لوط جمیا."
  - verse: 28
    text: "حران اپنے جمن دی زمین وچ, کلدیان دے اور وچ, اپنے پئیو تارح دے ہوندے ہوندے مر گیا."
  - verse: 29
    text: "ابرام تے نحور نے ویاہ کیتے. ابرام دی زال دا ناں سارئی ہا, تے نحور دی زال دا ناں ملکاہ ہا, جو حران دی دھی ہئی, اوہ حران جو ملکاہ تے اسکاہ دا پئیو ہا."
  - verse: 30
    text: "سارئی بانجھ ہئی; اوہدے کول کوئی بال نہ ہا."
  - verse: 31
    text: "تارح نے اپنا پتر ابرام, تے اپنے پتر حران دا پتر لوط, جو اوہدے پتر دا پتر ہا, تے اپنی کنوئی سارئی, جو اوہدے پتر ابرام دی بیوی ہئی, نال لیا, تے اوہ کلدیان دے اور تھوں کنعان دی زمین ول ونجݨ لئی نکلے. اوہ حران آئے تے اتّھے وس گئے."
  - verse: 32
    text: "تارح دے سارے دن 205 سال ہوئے, ول اوہ حران وچ مر گیا."
