    {
      "verse": 1,
      "text": "ہن خداوند نے ابرام نوں آکھیا: 'اپنے ملک, اپنے رشتے داراں, تے اپنے پئیو دے گھر نوں چھوڑ, تے اوہ زمین ول جا جیہڑی میں تینوں دسساں.'"
    },
    {
      "verse": 2,
      "text": "'میں تیرے تھوں اک وڈی قوم بݨاواں گا. میں تینوں برکت دیساں تے تیرا ناں وڈا کراں گا. تُو برکت ہوویں گا.'"
    },
    {
      "verse": 3,
      "text": "'میں اوہناں نوں برکت دیساں جیہڑے تینوں برکت دین گے, تے جو تینوں حقیر جانن اوہنوں لعنت دیساں. زمین دے سارے خاندان تیرے راہیں برکت پاون گے.'"
    },
    {
      "verse": 4,
