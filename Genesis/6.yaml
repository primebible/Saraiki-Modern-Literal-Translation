book: "پیدائش"
chapter: 6
verses:
  - verse: 1
    text: "جیں ویلے زمین دے مُکھ اُتے لوک ودھن لگ پئے, تے اوہناں نوں دھیواں جمیاں,"
  - verse: 2
    text: "تاں خدا دے پتراں نے ویکھیا کہ انساناں دیاں دھیواں سُوہنیاں نیں, تے جیہڑیاں اوہناں نوں پسند آئیاں اوہناں نوں اپنے لئی بیویاں بنا لِتیاں."
  - verse: 3
    text: "تے خداوند نے آکھیا: 'میری روح انسان دے نال ہمیشہ تک کشمکش نہ کریسی, کیوں جو اوہ وی جسم اے; سو انسان دے دن 120 سال ہون گے.'"
  - verse: 4
    text: "اوہناں دناں وچ زمین اُتے نفیلیم سن, تے بعد وچ وی, جیں ویلے خدا دے پتر انساناں دیاں دھیواں کول گئے تے اوہناں توں بچے جمے. اوہو قدیم دے زورآور مرد سن, نامور مرد."
  - verse: 5
    text: "تے خداوند نے ویکھیا کہ زمین اُتے انسان دی بدی بہُت ودھ گئی اے, تے انسان دے دل دیاں سوچاں دے ہر خیال ہر ویلے صرف بدی دے نیں."
  - verse: 6
    text: "تے خداوند نوں افسوس ہویا کہ اوہنے انسان نوں زمین اُتے بݨایا, تے اوہ اوہدے دل وچ غمگین ہویا."
  - verse: 7
    text: "تے خداوند نے آکھیا: 'میں انسان نوں جیہڑا میں بݨایا اے, زمین دے مُکھ تُوں مٹا دیساں, انسان, نال نال مویشی, رینگن آلیاں چیزاں, تے آسمان دے پرندے, کیوں جو مینوں افسوس اے کہ میں اوہناں نوں بݨایا.'"
  - verse: 8
    text: "پر نوح نے خداوند دیاں اکھاں وچ فضل لبھیا."
  - verse: 9
    text: "ایہ نوح دیاں نسلاں دی سرگزشت اے: نوح اپنے وقت دے لوکاں وچ راستباز تے بے عیب مرد ہا; نوح خدا نال تُردا ریا."
  - verse: 10
    text: "تے نوح دے تین پتر ہوئے: سام, حام, تے یافث."
  - verse: 11
    text: "زمین خدا دے حضور بگڑ گئی سی, تے زمین ظلم نال بھر گئی سی."
  - verse: 12
    text: "خدا نے زمین نوں ویکھیا, تے ویکھیا کہ اوہ بگڑ گئی اے; کیوں جو ساری بشر نے زمین اُتے اپنا رستہ بگاڑ لِتا سی."
  - verse: 13
    text: "تے خدا نے نوح نوں آکھیا: 'میں ساری بشر دا خاتمہ لے آواں گا, کیوں جو زمین اوہناں دے سبب ظلم نال بھر گئی اے. سو میں اوہناں نوں وی تے زمین نوں وی تباہ کرساں.'"
  - verse: 14
    text: "'توں گوفر دی لکڑی دی اک کشتی بݨا; کشتی وچ کوٹھڑیاں بݨائیں, تے کشتی نوں اندر تے باہر قیر نال لیپ کر.'"
  - verse: 15
    text: "'تے ایویں اوہنوں بݨا: کشتی دی لمبائی 300 ذراع, چوڑائی 50 ذراع, تے اوچائی 30 ذراع ہووے.'"
  - verse: 16
    text: "'کشتی وچ چھت بݨا, تے اوہنوں اوپر ول اک ذراع تک ختم کر. کشتی دا دروازہ اوہدے پاسے وچ رکھ. تے اوہنوں ہیٹھلی, دوجھی, تے تیجی منزل والی بݨا.'"
  - verse: 17
    text: "'ویکھ, میں پانی دا سیلاب ایہ زمین اُتے لیاواں گا, تاں جو آسمان تھلے جیہڑے وچ زندگی دی ساہ اے, ساری بشر ختم تھی جاوے; جیہڑا جیہڑا زمین اُتے اے سب مر سی.'"
  - verse: 18
    text: "'پر میں اپنا عہد تیرے نال قائم کراں گا; تے تُو کشتی وچ ونجیں گا — تُو, تیرے پتر, تیری بیوی, تے تیرے پتران دیاں زالاں تیرے نال.'"
  - verse: 19
    text: "'ساری مخلوق وچوں, ہر قسم دے جاندار وچوں, تُو ہر قسم دے دو دو کشتی وچ لے آ, تاں جو اوہ تیرے نال زندہ رہن; اوہ نر تے مادہ ہون.'"
  - verse: 20
    text: "'پرندے اپنی اپنی قسم مطابق, مویشی اپنی اپنی قسم مطابق, تے زمین اُتے رینگن آلی ہر چیز اپنی اپنی قسم مطابق — ہر قسم دے دو دو تیرے کول آپ آون گے تاں جو اوہناں نوں زندہ رکھیں.'"
  - verse: 21
    text: "'تُو اپنے نال ہر اوہ خوراک وی لے جا جیہڑی کھادی جاندی اے, تے اوہنوں اپنے لئی جمع کر; تے اوہ تیرے لئی تے اوہناں لئی خوراک ہو سی.'"
  - verse: 22
    text: "تے نوح نے ایویں ای کیتا; جیہڑا جیہڑا خدا نے اوہنوں حکم دِتا, اوہ سبھ کیتا."
