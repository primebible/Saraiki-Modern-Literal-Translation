    {
      "verse": 1,
      "text": "سو ابرام مصر تُوں اوپر چڑھ کے دکھن ول آیا, اوہ, اوہدی بیوی, جو کجھ اوہدے کول سی, تے لوط وی اوہدے نال."
    },
    {
      "verse": 2,
      "text": "ابرام مویشی, چاندی, تے سونے وچ بہُت مال دار ہا."
    },
    {
      "verse": 3,
      "text": "اوہ دکھن تُوں اپنے سفر کردا ریا جیں تک بیت ایل تک پہنچیا, اوتّھے تھاں تک جتھے اوہدے خیمے دا پہلا ٹھکانا ہا, بیت ایل تے عائی دے وچکار."
    },
    {
      "verse": 4,
      "text": "اوہ اوہو ہی تھاں ہا جتھے اوہنے پہلی وار قربان گاہ بنائی ہئی; اوتّھے ابرام نے خداوند دا ناں پکاریا."
    },
    {
      "verse": 5,
      "text": "لوط, جیہڑا ابرام دے نال سی, اوہدے کول وی بھیڑاں, ریوڑ, تے خیمے سن."
    },
    {
      "verse": 6,
      "text": "تے اوہ زمین اینہاں نوں اکٹھے وسا نہ سکدی سی, کیوں جو اوہناں دی ملکیت اینی وڈی سی کہ اوہ اکٹھے نہ وس سکدے سن."
    },
    {
      "verse": 7,
      "text": "سو ابرام دے مویشیان دے چرواہیاں تے لوط دے مویشیان دے چرواہیاں وچ جھگڑا ہون لگ پیا. اوہ ویلے کنعانی تے فرزی اوہ زمین وچ وسدے سن."
    },
    {
      "verse": 8,
      "text": "ابرام نے لوط نوں آکھیا: 'مہربانی کر کے, میرے تے تیرے وچ, تے میرے چرواہیاں تے تیرے چرواہیاں وچ جھگڑا نہ ہووے, کیوں جو اسی رشتے دار آں.'"
    },
    {
      "verse": 9,
      "text": "'کیا ساری زمین تیرے کولھ نہیں؟ مہربانی کر کے تُو میرے تُوں وکھ ہو جا. جے تُو کھبے ہتھ ول جاویں گا, تاں میں سجے ول جاواں گا; تے جے تُو سجے ول جاویں گا, تاں میں کھبے ول جاواں گا.'"
    },
    {
      "verse": 10,
      "text": "لوط نے اپنی اکھاں چکیاں تے سارے یردن دے میدان نوں ویکھیا کہ اوہ سارے پاسوں چنگی طرح سیراب ہا (اوہ ویلے تک جیں ویلے خداوند نے سدوم تے عمورہ نوں برباد نہ کیتا ہا), خداوند دے باغ وانگ, تے مصر دی زمین وانگ, جیں تُوں صوغر ول جاندا اے."
    },
    {
