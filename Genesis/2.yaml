book: "پیدائش"
chapter: 2
verses:
  - verse: 1
    text: "چنانچہ آسماناں تے زمین، تے اُنہاں دا سارا لشکر پورا تھی ویا۔"
  - verse: 2
    text: "ستویں ڈیں خدا نے اپنا اوہ کم پورا کیتا جیہڑا اوُں نے کیتا ہا؛ تے ستویں ڈیں اوُں نے اپنے سارے کم توں آرام کیتا۔"
  - verse: 3
    text: "خدا نے ستویں ڈیں کوُ برکت ڈِتی تے اوُں کوُ مقدس ٹھہرایا، کیوں جو اوُں نے اوندے وِچ اپنے سارے بناون آلے کم توں آرام کیتا۔"
  - verse: 4
    text: "ایہہ آسماناں تے زمین دی سرگزشت ہِے، جئیں ویلے اوہ بنائے گئے، اوہ ڈیں جئیں ویلے خداوند خدا نے زمین تے آسمان بنائے۔"
  - verse: 5
    text: "نہ کھیت دی کوئی بوٹی ہالی تائیں زمین وِچ ہا، تے نہ کھیت دا کوئی سبزہ ہالی تائیں اگیا ہا؛ کیوں جو خداوند خدا نے زمین تے میہہ نہ وسایا ہا، تے زمین کوُ جوتن آلا بندہ وی نہ ہا۔"
  - verse: 6
    text: "پر زمین توں ہک بھاپ اُٹھدی ہا تے ساری سطحِ زمین کوُ تر کریندی ہا۔"
  - verse: 7
    text: "ول خداوند خدا نے آدم کوُ زمین دی خاک وِچوں بنایا، تے اوندے نتھنیاں وِچ زندگی دی سانس پھونکی، تے آدم جیتی جان تھی ویا۔"
  - verse: 8
    text: "ول خداوند خدا نے مشرق ول عدن وِچ ہک باغ لگایا، تے اوتّھے اوُں نے آدم کوُ رکھیا جیہڑا اوُں نے بنایا ہا۔"
  - verse: 9
    text: "ول خداوند خدا نے زمین توں ہر اوہ درخت اگایا جو ڈیکھن کوُ خوشنما تے کھان کوُ چنگا ہا؛ تے باغ دے وچکار حیات دا درخت، تے نیکی تے بدی دی پہچان دا درخت وی ہا۔"
  - verse: 10
    text: "ول عدن توں ہک دریا نکلیا باغ کوُ سیراب کرن دے کیتے، تے اوتّھوں اوہ چار دریاواں دے سرچشمیاں وِچ ونڈ گیا۔"
  - verse: 11
    text: "پہلے دا ناں پیشون ہا؛ اوہ ساری حویلہ دی زمین وِچوں گزریندا ہا، جتھے سونا ہا۔"
  - verse: 12
    text: "تے اُس مُلک دا سونا چنگا ہا؛ بدلیم تے جزع دا پتھر وی اوتّھے ہا۔"
  - verse: 13
    text: "ڈوجھے دریا دا ناں جیحون ہا؛ اوہ اوہو دریا ہِے جیہڑا ساری کوش دی زمین وِچوں گزریندا ہا۔"
  - verse: 14
    text: "تیجھے دریا دا ناں حدّیقل ہا؛ ایہہ اوہ ہِے جیہڑا اسور دے سامھن بہندا ہا۔ چوتھے دریا دا ناں فرات ہا۔"
  - verse: 15
    text: "ول خداوند خدا نے آدم کوُ لیا، تے اوُں کوُ عدن دے باغ وِچ رکھیا تاں جو اوندی آبادی کرے تے اوندی نگہبانی کرے۔"
  - verse: 16
    text: "ول خداوند خدا نے آدم کوُ حُکم ڈِتا، آکھیا: 'باغ دے ہر درخت دے پھل توں کھُلّ کے کھا،'"
  - verse: 17
    text: "'پر نیکی تے بدی دی پہچان دے درخت دے پھل توں نہ کھاویں؛ کیوں جو جیویں ہی تُوں اوندے وِچوں کھاسیں، تُوں ضرور مرسیں۔'"
  - verse: 18
    text: "ول خداوند خدا نے آکھیا: 'آدم دا اکیلا راہنا چنگا نئیں؛ میں اوندے کیتے اوندے ورگا مددگار بناواں۔'"
  - verse: 19
    text: "ول خداوند خدا نے زمین توں کھیت دے سارے جانور تے آسمان دے سارے پرندے بنائے، تے اُنہاں کوُ آدم کول لیا آیا تاں جو ڈیکھے اوہ اُنہاں کوُ کیا ناں رکھسی؛ تے جیہڑا ناں آدم نے ہر ذی جان کوُ رکھیا، اوہو اوندا ناں ٹھہریا۔"
  - verse: 20
    text: "ول آدم نے سارے مویشی، آسمان دے پرندیاں، تے کھیت دے سارے جانوراں دے ناں رکھے؛ پر آدم دے کیتے اوندے ورگا مددگار نہ لبھیا۔"
  - verse: 21
    text: "ول خداوند خدا نے آدم تے گہری نیند طاری کیتی، تے اوہ سُت گیا؛ تے اوُں نے اوندیاں پسلیاں وِچوں ہک کڈی، تے اوندی تھاں گوشت نال بھر ڈِتا۔"
  - verse: 22
    text: "ول خداوند خدا نے اوُں پسلی توں، جیہڑی اوُں نے آدم توں کڈی ہا، ہک عورت بنائی تے اوُں کوُ آدم کول لیا آیا۔"
  - verse: 23
    text: "ول آدم نے آکھیا: 'ہُن ایہہ میڈیاں ہڈیاں وِچوں ہڈی تے میڈے گوشت وِچوں گوشت ہِے؛ ایہہ عورت اکھویسی، کیوں جو ایہہ مرد توں کڈی گئی ہِے۔'"
  - verse: 24
    text: "ایں کیتے مرد اپنے پیو تے اپنی ماں کوُ چھوڑ کے اپنی بیوی نال جڑ ویسی، تے اوہ ڈونویں ہک تن تھی ویسن۔"
  - verse: 25
    text: "ول آدم تے اوندی بیوی ڈونویں ننگے ہن، تے اوہ شرمندہ نہ ہن۔"
