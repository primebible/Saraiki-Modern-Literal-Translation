book: "پیدائش"
chapter: 2
verses:
  - verse: 1
    text: "تے آسماناں، زمین تے اُنہاں دا سارا لشکر پورے تھی ڳئے۔"
  - verse: 2
    text: "تے ستویں ݙینہہ خدا نے اپݨا اوہ کم پورا کیتا جیہڑا اُوں نے کیتا ہا؛ تے ستویں ݙینہہ اُوں نے اپݨے سارے کم توں آرام کیتا۔"
  - verse: 3
    text: "تے خدا نے ستویں ݙینہہ کُوں برکت ݙِتی تے اُوں کُوں مقدس ٹھہرایا، کیوں جو اُوں ݙینہہ اُوں نے اپݨے سارے اُوں کم توں آرام کیتا جیہڑا خدا نے پیدا کر کے بݨایا ہا۔"
  - verse: 4
    text: "ایہہ آسماناں تے زمین دی سرگزشت ہِے، جݙاں اوہ پیدا کیتے ڳئے؛ اُوں ݙینہہ جݙاں خداوند خدا نے زمین تے آسمان بݨائے۔"
  - verse: 5
    text: "کھیت دی کوئی جھاڑی ہالی تائیں زمین اُتے نہ ہئی، تے کھیت دا کوئی سبزہ ہالی تائیں نہ اُڳیا ہا؛ کیوں جو خداوند خدا نے زمین اُتے مینہہ نہ وسایا ہا، تے زمین کُوں جوتݨ آلا کوئی انسان نہ ہا۔"
  - verse: 6
    text: "پر زمین توں پاݨی دا ہک بہاؤ اُبھردا ہا تے ساری زمین دی سطح کُوں تر کریندا ہا۔"
  - verse: 7
    text: "تے خداوند خدا نے آدم کُوں زمین دی مٹی توں گھڑیا، تے اوندیاں نتھنیاں وِچ حیاتی دی سانس پھونکی؛ تے آدم ہک جیتی جان تھی ڳیا۔"
  - verse: 8
    text: "تے خداوند خدا نے مشرق ول عدن وِچ ہک باغ لگایا، تے اُتھاں اُوں نے آدم کُوں رکھیا جیہڑا اُوں نے گھڑیا ہا۔"
  - verse: 9
    text: "تے خداوند خدا نے زمین توں ہر اوہ درخت اُڳایا جیہڑا ݙیکھݨ وِچ سوہݨا تے کھاوݨ وِچ چنڳا ہا؛ تے باغ دے وچکار حیات دا درخت تے نیکی تے بدی دی پہچان دا درخت وی اُڳایا۔"
  - verse: 10
    text: "تے عدن توں ہک دریا باغ کُوں سیراب کرݨ دے کیتے نکلدا ہا؛ تے اُتھوں اوہ چار دریاواں وِچ ونڈ ڳیا۔"
  - verse: 11
    text: "پہلے دریا دا ناں پیشون ہا؛ اوہ ساری حویلہ دی زمین دے چوگرد وڳدا ہا، جتھاں سونا ہا۔"
  - verse: 12
    text: "تے اُوں ملک دا سونا چنڳا ہا؛ اُتھاں بدلیم تے جزع دا پتھر وی ہا۔"
  - verse: 13
    text: "ݙوجھے دریا دا ناں جیحون ہا؛ اوہ اوہو دریا ہا جیہڑا ساری کوش دی زمین دے چوگرد وڳدا ہا۔"
  - verse: 14
    text: "تریجھے دریا دا ناں حدّیقل ہا؛ اوہ اسور دے مشرق پاسے وڳدا ہا۔ تے چوتھا دریا فرات ہا۔"
  - verse: 15
    text: "تے خداوند خدا نے آدم کُوں لے کے عدن دے باغ وِچ رکھیا، تاں جو اوہ اوندے وِچ کم کرے تے اوندی رکھوالی کرے۔"
  - verse: 16
    text: "تے خداوند خدا نے آدم کُوں حکم ݙِتا تے آکھیا: باغ دے ہر درخت توں کھُلّ کے کھا؛"
  - verse: 17
    text: "پر نیکی تے بدی دی پہچان دے درخت توں نہ کھاویں؛ کیوں جو جیں ݙینہہ تُوں اوندے وِچوں کھاسیں، تُوں ضرور مرسیں۔"
  - verse: 18
    text: "تے خداوند خدا نے آکھیا: آدم دا اکیلا رہوݨ چنڳا نئیں؛ میں اوندے کیتے اوندے برابر دا ہک مددگار بݨاواں۔"
  - verse: 19
    text: "تے خداوند خدا نے زمین دی مٹی توں کھیت دے ہر جانور تے آسمان دے ہر پرندے کُوں گھڑیا، تے اُنہاں کُوں آدم کول لے آیا تاں جو ݙیکھے کہ اوہ اُنہاں دا کیا ناں رکھسی؛ تے ہر جیتی جان دا جیہڑا ناں آدم نے رکھیا، اوہو اوندا ناں ہا۔"
  - verse: 20
    text: "تے آدم نے سارے مویشیاں، آسمان دے پرندیاں تے کھیت دے سارے جانوراں دے ناں رکھے؛ پر آدم دے کیتے اوندے برابر دا کوئی مددگار نہ لبھیا۔"
  - verse: 21
    text: "تے خداوند خدا نے آدم اُتے گہری نیند پا ݙِتی، تے اوہ سُت ڳیا؛ تے اُوں نے اوندیاں پسلیاں وِچوں ہک پسلی کݙھی، تے اوندی تھاں گوشت نال بند کر ݙِتی۔"
  - verse: 22
    text: "تے خداوند خدا نے اُوں پسلی توں، جیہڑی اُوں نے آدم توں کݙھی ہئی، ہک عورت بݨائی تے اُوں کُوں آدم کول لے آیا۔"
  - verse: 23
    text: "تے آدم نے آکھیا: ہُن آخر ایہہ میݙیاں ہڈیاں وِچوں ہڈی تے میݙے گوشت وِچوں گوشت ہِے؛ ایہہ عورت آکھویسی، کیوں جو ایہہ مرد توں کݙھی ڳئی ہِے۔"
  - verse: 24
    text: "ایں کیتے ہک مرد اپݨے پیو تے اپݨی ماں کُوں چھوڑ کے اپݨی بیوی نال جڑ ویسی، تے اوہ ݙونویں ہک تن تھی ویسن۔"
  - verse: 25
    text: "تے آدم تے اوندی بیوی ݙونویں ننگے ہن، تے اوہ شرمندہ نہ ہن۔"
