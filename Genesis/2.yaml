book: "پیدائش"
chapter: 2
verses:
  - verse: 1
    text: "سو آسماناں تے زمین، تے اوہناں دا سارا لشکر پورا تھی وئے۔"
  - verse: 2
    text: "ستویں ݙینہہ خدا نے اپنا اوہ کم پورا کیتا جیہڑا اوہ کیتا ہا؛ تے ستویں ݙینہہ اوہ اپنے سارے کم تُوں آرام کیتا۔"
  - verse: 3
    text: "خدا نے ستویں ݙینہہ نوں برکت دِتی تے اوہنوں مقدس ٹھہرایا، کیوں جو اوہ اس وچ اپنے سارے بناؤن آلے کم تُوں آرام کیتا۔"
  - verse: 4
    text: "ایہ آسماناں تے زمین دی سرگزشت اے، جِیں ویلے اوہ بنائے گئے، اوہ دن جِیں ویلے خداوند خدا نے زمین تے آسمان بنائے۔"
  - verse: 5
    text: "نہ کھیت دی کوئی بوٹی ہالے تائیں زمین وچ سی، تے نہ کھیت دا کوئی سبزہ ہالے تائیں اگیا ہا؛ کیوں جو خداوند خدا نے زمین اُتے میہہ نہ وسایا ہا، تے زمین نوں جوتݨ آلا آدم وی نہ ہا۔"
  - verse: 6
    text: "پر زمین تُوں اک بھاپ اُٹھدی ہئی تے ساری سطحِ زمین نوں تر کرندی ہئی۔"
  - verse: 7
    text: "تے خداوند خدا نے آدم نوں زمین دی خاک وچوں بݨایا، تے اوہدے نتھنیاں وچ زندگی دی سانس پھونکی، تے آدم جِیتی جان تھی ویا۔"
  - verse: 8
    text: "تے خداوند خدا نے مشرق ول عدن وچ اک باغ لگایا، تے اوتّھے اوہ آدم نوں رکھیا جیہڑا اوہنے بݨایا ہا۔"
  - verse: 9
    text: "تے خداوند خدا نے زمین تُوں ہر اوہ درخت اگایا جو ویکھݨ نوں خوشنما تے کھان نوں چنگا ہا؛ تے باغ دے وچکار حیات دا درخت، تے نیکی تے بدی دی پہچان دا درخت وی ہا۔"
  - verse: 10
    text: "تے عدن تُوں اک دریا نکلیا باغ نوں سیراب کرݨ واسطے، تے اتّھوں اوہ چار دریان دے سرچشمیاں وچ ونڈ گیا۔"
  - verse: 11
    text: "پہلے دا ناں پیشون ہا؛ اوہ ساری حویلہ دی زمین وچوں گزرندا ہا، جتھے سونا ہا۔"
  - verse: 12
    text: "تے اوہ مُلک دا سونا چنگا ہا؛ بدلیم تے جزع دا پتھر وی اوتّھے ہا۔"
  - verse: 13
    text: "دوجھے دریا دا ناں جیحون ہا؛ اوہ اوہو دریا اے جیہڑا ساری کوش دی زمین وچوں گزرندا ہا۔"
  - verse: 14
    text: "تیجے دریا دا ناں حدّیقل ہا؛ ایہ اوہ اے جیہڑا اسور دے سامھݨے بہندا ہا۔ چوتھے دریا دا ناں فرات ہا۔"
  - verse: 15
    text: "تے خداوند خدا نے آدم نوں لیا، تے اوہنوں عدن دے باغ وچ رکھیا تاں جو اوہدے نوں آباد کرے تے اوہدے دی نگہبانی کرے۔"
  - verse: 16
    text: "تے خداوند خدا نے آدم نوں حُکم دِتا، آکھیا: 'باغ دے ہر درخت دے پھل تُوں کھُلّ کے کھا،'"
  - verse: 17
    text: "'پر نیکی تے بدی دی پہچان دے درخت دے پھل تُوں نہ کھاویں؛ کیوں جو جِیویں ہی تُوں اوہدے وچوں کھاویں گا، تُوں ضرور مرسی۔'"
  - verse: 18
    text: "تے خداوند خدا نے آکھیا: 'آدم دا اکیلا رہنا چنگا نئیں؛ میں اوہدے واسطے اوہدے ورگا مددگار بݨاواں۔'"
  - verse: 19
    text: "تے خداوند خدا نے زمین تُوں کھیت دے سارے جانور تے آسمان دے سارے پرندے بݨائے، تے اوہناں نوں آدم کولھ لیا آیا تاں جو ویکھے اوہ اوہناں نوں کیا ناں رکھسی؛ تے جیہڑا ناں آدم ہر ذی جان نوں رکھیا، اوہو اوہدے ناں ٹھہریا۔"
  - verse: 20
    text: "تے آدم نے سارے مویشی، آسمان دے پرندیاں، تے کھیت دے سارے جانوراں دے ناں رکھے؛ پر آدم واسطے اوہدے ورگا مددگار نہ لبھیا گیا۔"
  - verse: 21
    text: "تے خداوند خدا نے آدم اُتے گہری نیند طاری کیتی، تے اوہ سُت گیا؛ تے اوہنے اوہدیاں پسلیاں وچوں اک کڍی، تے اوہدی تھاں گوشت نال بھر دِتا۔"
  - verse: 22
    text: "تے خداوند خدا نے اوہ پسلی تُوں، جیہڑی اوہنے آدم تُوں کڍی ہئی، اک عورت بݨائی تے اوہنوں آدم کولھ لیا آیا۔"
  - verse: 23
    text: "تے آدم آکھیا: 'ہُن ایہ میریاں ہڈیاں وچوں ہڈی تے میرے گوشت وچوں گوشت اے؛ ایہ عورت کہلانڑی اے، کیوں جو ایہ مرد تُوں کڍی گئی اے۔'"
  - verse: 24
    text: "ایس واسطے مرد آپݨے پئیو تے آپݨی ماں نوں چھوڑ کے اپنی بیوی نال جڑ ویسی، تے اوہناں دونویں اک تن ہو ون گے۔"
  - verse: 25
    text: "تے آدم تے اوہدے بیوی دونویں ننگے سن، تے اوہ شرمندہ نہ سن۔"
