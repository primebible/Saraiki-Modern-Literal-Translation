book: "پیدائش"
chapter: 3
verses:
  - verse: 1
    text: "ہن سانپ کھیت دے سارے جانوراں وچوں سب توں زیادہ مکار ہا جیہڑا خداوند خدا نے بݨایا ہا۔ اوہ عورت نوں آکھیا: 'کیا خدا نے واقعی آکھیا اے کہ تُسی باغ دے کسے وی درخت دے پھل وچوں نہ کھاؤ؟'"
  - verse: 2
    text: "عورت نے سانپ نوں آکھیا: 'اسی باغ دے درختاں دے پھل کھا سکدے آں،'"
  - verse: 3
    text: "'پر جیہڑا درخت باغ دے وچکار اے اوہدے پھل دے بارے خدا نے آکھیا اے: 'تُسی اوہدے وچوں نہ کھاؤ، تے نہ اوہنوں چھھوؤ، نہیں تے مرسو.''"
  - verse: 4
    text: "سانپ نے عورت نوں آکھیا: 'تُسی ہرگز نہیں مرسو،'"
  - verse: 5
    text: "'کیوں جو خدا جاندا اے کہ جس دن تُسی اوہدے وچوں کھاؤ گے تُہاڈیاں اکھاں کھُل ویسن، تے تُسی خدا وانگ ہو سو، نیکی تے بدی دی پہچان رکھسو۔'"
  - verse: 6
    text: "جِیں ویلے عورت نے ویکھیا کہ اوہ درخت کھان نوں چنگا اے، اکھاں نوں خوشنما اے، تے عقل دےن واسطے پسندیدہ اے، اوہنے اوہدے پھل وچوں لیا تے کھادا؛ ول اوہنے اپنے نال ہوندے خاوند نوں وی دِتا، تے اوہنے وی کھادا۔"
  - verse: 7
    text: "تے اوہناں دیاں اکھاں کھل گئیاں، تے اوہ دونویں جان گئے کہ اوہ ننگے نیں؛ سو اوہناں نے انجیر دے پتے سیئے تے اپنے لئی لباس بݨائے۔"
  - verse: 8
    text: "تے اوہناں نے دن دے ٹھنڈے ویلے باغ وچ تُردے ہوئے خداوند خدا دی آواز سُنی، تے آدم تے اوہدی بیوی باغ دے درختاں وچ خداوند خدا دے حضور تُوں لُک گئے۔"
  - verse: 9
    text: "تے خداوند خدا نے آدم نوں پکاریا تے آکھیا: 'تُوں کتھے آہیں؟'"
  - verse: 10
    text: "اوہ نے آکھیا: 'میں باغ وچ تُہاڈی آواز سُنی تے میں ڈر گیا، کیوں جو میں ننگا ہا؛ اس واسطے میں لُک گیا۔'"
  - verse: 11
    text: "اوہ نے آکھیا: 'کِس نے تُہنوں آکھیا کہ تُوں ننگا آہیں؟ کیا تُوں اوہ درخت وچوں کھادا جے دے بارے میں میں حکم دِتا ہا کہ تُوں اوہدے وچوں نہ کھائیں؟'"
  - verse: 12
    text: "آدم نے آکھیا: 'اوہ عورت جیہڑی تُسیں مینوں نال دِتی ہئی، اوہنے مینوں درخت دا پھل دِتا، تے میں کھادا۔'"
  - verse: 13
    text: "تے خداوند خدا نے عورت نوں آکھیا: 'تُوں ایہ کیا کیتا؟' عورت نے آکھیا: 'سانپ نے مینوں فریب دِتا، تے میں کھادا۔'"
  - verse: 14
    text: "تے خداوند خدا نے سانپ نوں آکھیا: 'چونکہ تُوں ایہ کیتا اے، تُو سارے مویشیاں تے کھیت دے سارے جانوراں وچوں لعنتی ٹھہریا؛ تُو اپنے پیٹ اُتے تُریں گا، تے اپنی عمر دے سارے دِن مٹی کھاویں گا۔'"
  - verse: 15
    text: "'تے میں تیرے تے عورت دے وچکار، تے تیرے نسل تے اوہدی نسل دے وچکار عداوت پاواں گا؛ اوہ تیرے سر نوں کُچلے ویسی، تے تُو اوہدے ایڑی نوں ڈسے ویسا۔'"
  - verse: 16
    text: "عورت نوں اوہنے آکھیا: 'میں تیرے حمل دے درد نوں بہت وادھاواں گا؛ تُو درد نال بچے جمسی؛ تیری خواہش اپنے خاوند لئی ہو ویسی، تے اوہ تیرے اُتے حکمرانی کریسی۔'"
  - verse: 17
    text: "تے آدم نوں اوہنے آکھیا: 'چونکہ تُوں اپنی بیوی دی آواز سُنی تے اوہ درخت وچوں کھادا، جیہڑے بارے میں میں آکھیا ہا: 'تُوں اوہدے وچوں نہ کھائیں'، اس واسطے زمین تیرے سبب لعنتی ٹھہری؛ تُو اپنی عمر دے سارے دناں وچ رنج تے محنت نال اوہدے وچوں کھاویں گا۔'"
  - verse: 18
    text: "'اوہ تیرے لئی کانٹے تے جھاڑ پیدا کریسی؛ تے تُو کھیت دا سبزہ کھاویں گا۔'"
  - verse: 19
    text: "'تُو اپنے چہرے دے پسینے نال روٹی کھاویں گا، جندھ تائیں تُو زمین ول مُڑ نہ ویں، کیوں جو تُو اوہدے وچوں کڍیا گیا ہا؛ کیوں جو تُو مٹی آہیں، تے مٹی ول ہی مُڑ سی۔'"
  - verse: 20
    text: "تے آدم نے اپنی بیوی دا ناں حوّا رکھیا، کیوں جو اوہ سارے جیتیاں دی ماں ہو ویسی۔"
  - verse: 21
    text: "تے خداوند خدا نے آدم تے اوہدے بیوی لئی کھالاں دے لباس بݨائے تے اوہناں نوں پہنا دِتے۔"
  - verse: 22
    text: "تے خداوند خدا نے آکھیا: 'ویکھو، آدم نیکی تے بدی دی پہچان وچ ساڈے وچوں اک وانگر ہو گیا اے؛ ہُن کہیں ایسا نہ ہووے جو اوہ ہاتھ وڈھائے تے حیاتی دے درخت وچوں وی لَے، تے کھا کے ہمیشہ جیوے۔'"
  - verse: 23
    text: "سو خداوند خدا نے اوہنوں عدن دے باغ تُوں کڈھ دِتا، تاں جو اوہ اوہ زمین نوں جوتے جیہڑی وچوں اوہ کڍیا گیا ہا۔"
  - verse: 24
    text: "تے اوہنے آدم نوں کڈھ دِتا؛ تے عدن دے باغ دے مشرق ول اوہنے کروبی فرشتے رکھے، تے اک شعلہ زن تلوار جیہڑی ہر پاسے گھُمدی فِردی ہئی، تاں جو حیاتی دے درخت دے رستے دی نگہبانی کرن۔"
