book: "پیدائش"
chapter: 3
verses:
  - verse: 1
    text: "ہُن سانپ کھیت دے سارے جانوراں توں زیادہ مکار ہا جنھاں کُوں خداوند خدا نے بݨایا ہا۔ تے اُوں عورت کُوں آکھیا: کیا خدا نے سچ مچ آکھیا ہِے جو تُساں باغ دے کسے وی درخت توں نہ کھاؤ؟"
  - verse: 2
    text: "تے عورت نے سانپ کُوں آکھیا: اساں باغ دے درختاں دے پھل کھا سڳدے ہاں؛"
  - verse: 3
    text: "پر باغ دے وچکار آلے درخت دے پھل بارے خدا نے آکھیا ہِے: تُساں اوندے وِچوں نہ کھاؤ تے اُوں کُوں ہتھ وی نہ لاؤ، متاں تُساں مر ونڄو۔"
  - verse: 4
    text: "تے سانپ نے عورت کُوں آکھیا: تُساں ہرگز نہ مرسو۔"
  - verse: 5
    text: "کیوں جو خدا ڄاݨدا ہِے جو جیں ݙینہہ تُساں اوندے وِچوں کھاسو، تُہاݙیاں اکھیں کھُل ویسن، تے تُساں خدا وانگ نیکی تے بدی ڄاݨݨ آلے تھی ویسو۔"
  - verse: 6
    text: "تے عورت نے ݙِٹھا جو او درخت کھاوݨ دے کیتے چنڳا، اکھیں کُوں سوہݨا، تے سیاݨا بݨݨ دے کیتے من بھاوݨا ہا؛ تے اُوں اوندے پھل وِچوں گِھدا تے کھادا۔ ول اپݨے خاوند کُوں وی، جیہڑا اوندے نال ہا، ݙِتا؛ تے اُوں وی کھادا۔"
  - verse: 7
    text: "تے اُنہاں ݙونہاں دیاں اکھیں کھُل ڳیاں، تے او ݙونویں ڄاݨ ڳئے جو او ننگے ہن؛ تے اُنہاں انجیر دے پتر سِیتے تے اپݨے کیتے کمر بند بݨائے۔"
  - verse: 8
    text: "تے ݙینہہ دی ٹھنڈی ہوا دے ویلے اُنہاں خداوند خدا دے باغ وِچ ٹرݨ دی آواز سُݨی؛ تے آدم تے اوندی بیوی خداوند خدا دے حضور توں باغ دے درختاں دے وچکار لُک ڳئے۔"
  - verse: 9
    text: "تے خداوند خدا نے آدم کُوں سݙیا تے آکھیا: تُوں کتھاں ہِیں؟"
  - verse: 10
    text: "اُوں آکھیا: میں باغ وِچ تیݙی آواز سُݨی تے ݙر ڳیا، کیوں جو میں ننگا ہا؛ ایں کیتے میں لُک ڳیا۔"
  - verse: 11
    text: "تے اُوں آکھیا: تیکُوں کئیں ݙسیا جو تُوں ننگا ہِیں؟ کیا تَیں اُوں درخت توں کھادا، جین٘دے بارے میں تیکُوں حکم ݙِتا ہا جو اوندے وِچوں نہ کھاویں؟"
  - verse: 12
    text: "آدم نے آکھیا: او عورت جیہڑی تَیں میݙے نال ݙِتی ہئی، اُوں میکُوں درخت دا پھل ݙِتا، تے میں کھادا۔"
  - verse: 13
    text: "تے خداوند خدا نے عورت کُوں آکھیا: ایہہ تَیں کیا کیتا؟ عورت نے آکھیا: سانپ نے میکُوں دھوکا ݙِتا، تے میں کھادا۔"
  - verse: 14
    text: "تے خداوند خدا نے سانپ کُوں آکھیا: کیوں جو تَیں ایہہ کیتا ہِے، تُوں سارے مویشیاں تے کھیت دے سارے جانوراں توں ودھ لعنتی ہِیں؛ تُوں اپݨے پیٹ اُتے ٹرسیں، تے اپݨی حیاتی دے سارے ݙینہاں مٹی کھاسیں۔"
  - verse: 15
    text: "تے میں تیݙے تے عورت دے وچکار، تے تیݙی نسل تے اوندی نسل دے وچکار دشمنی پا ݙیساں؛ اوہ تیݙے سر اُتے وار کریسی، تے تُوں اوندی ایڑی اُتے وار کریسیں۔"
  - verse: 16
    text: "عورت کُوں اُوں آکھیا: میں تیݙے حمل تے ٻال ڄمݨ دے دُکھ ٻہوں ودھا ݙیساں؛ تُوں درد نال ٻال ڄمیسیں؛ تیݙی خواہش تیݙے خاوند ول ہوسی، تے اوہ تیݙے اُتے راڄ کریسی۔"
  - verse: 17
    text: "تے آدم کُوں اُوں آکھیا: کیوں جو تَیں اپݨی بیوی دی آواز سُݨی تے اُوں درخت توں کھادا، جین٘دے بارے میں تیکُوں حکم ݙِتا ہا: اوندے وِچوں نہ کھاویں؛ ایں کیتے زمین تیݙے پاروں لعنتی ہِے؛ تُوں اپݨی حیاتی دے سارے ݙینہاں دُکھ نال اوندے وِچوں کھاسیں۔"
  - verse: 18
    text: "اوہ تیݙے کیتے کنڈے تے جھاڑ اُڳاسی، تے تُوں کھیت دا سبزہ کھاسیں۔"
  - verse: 19
    text: "تُوں اپݨے مُن٘ہ دے پسینے نال روٹی کھاسیں، جیں تائیں تُوں زمین ول مُڑ نہ ویسیں، کیوں جو تُوں اوندے وِچوں کݙھیا ڳیا ہا؛ کیوں جو تُوں مٹی ہِیں، تے مٹی ول مُڑسیں۔"
  - verse: 20
    text: "تے آدم نے اپݨی بیوی دا ناں حوّا رکھیا، کیوں جو او سارے جیتیاں دی ماں ہئی۔"
  - verse: 21
    text: "تے خداوند خدا نے آدم تے اوندی بیوی دے کیتے کھل دے چولے بݨائے تے اُنہاں کُوں پوا ݙِتے۔"
  - verse: 22
    text: "تے خداوند خدا نے آکھیا: ݙیکھو، آدم نیکی تے بدی ڄاݨݨ وِچ ساݙے وِچوں ہک وانگ تھی ڳیا ہِے؛ ہُن متاں او اپݨا ہتھ ودھاوے، تے حیات دے درخت توں وی گِھن کے کھاوے، تے ہمیشاں جِیندا رہے۔"
  - verse: 23
    text: "ایں کیتے خداوند خدا نے اُوں کُوں عدن دے باغ توں بھیڄ ݙِتا، تاں جو او اُوں زمین کُوں جوتے جیہڑی وِچوں او کݙھیا ڳیا ہا۔"
  - verse: 24
    text: "تے اُوں آدم کُوں باغ توں کݙھ ݙِتا؛ تے عدن دے باغ دے مشرق پاسے کروبی تے ہر پاسے مُڑدی بھڑکدی تلوار رکھ ݙِتے، تاں جو حیات دے درخت دے راہ دی رکھوالی کرن۔"
