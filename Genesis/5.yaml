book: "پیدائش"
chapter: 5
verses:
  - verse: 1
    text: "ایہ آدم دیاں نسلاں دی کتاب اے. جیں ویلے خدا نے انسان بݨایا، اوہنوں خدا دی صورت تے شبیہ مطابق بݨایا."
  - verse: 2
    text: "اوہنے اوہناں نوں نر تے مادہ بݨایا، تے اوہناں نوں برکت دِتی. اوہ دن جیں ویلے اوہ بنائے گئے، اوہناں دا ناں 'آدم' رکھیا."
  - verse: 3
    text: "آدم نے 130 سال جئے، تے اوہدے اک پتر اپنی صورت تے شبیہ مطابق جمیا، تے اوہنے اوہدے ناں شیث رکھیا."
  - verse: 4
    text: "ول شیث دا پیو ہون توں بعد آدم نے 800 سال جئے، تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 5
    text: "آدم دے سارے دن 930 سال ہوئے، ول اوہ مر گیا."
  - verse: 6
    text: "شیث نے 105 سال جئے، ول شیث تھوں انوش جمیا."
  - verse: 7
    text: "ول انوش دا پیو ہون توں بعد شیث نے 807 سال جئے، تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 8
    text: "شیث دے سارے دن 912 سال ہوئے، ول اوہ مر گیا."
  - verse: 9
    text: "انوش نے 90 سال جئے، تے انوش تھوں قینان جمیا."
  - verse: 10
    text: "ول قینان دا پیو ہون توں بعد انوش نے 815 سال جئے، تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 11
    text: "انوش دے سارے دن 905 سال ہوئے، ول اوہ مر گیا."
  - verse: 12
    text: "قینان نے 70 سال جئے، ول قینان تھوں مہلل ایل جمیا."
  - verse: 13
    text: "ول مہلل ایل دا پیو ہون توں بعد قینان نے 840 سال جئے، تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 14
    text: "قینان دے سارے دن 910 سال ہوئے، ول اوہ مر گیا."
  - verse: 15
    text: "مہلل ایل نے 65 سال جئے، ول مہلل ایل تھوں یارد جمیا."
  - verse: 16
    text: "ول یارد دا پیو ہون توں بعد مہلل ایل نے 830 سال جئے، تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 17
    text: "مہلل ایل دے سارے دن 895 سال ہوئے، ول اوہ مر گیا."
  - verse: 18
    text: "یارد نے 162 سال جئے، ول یارد تھوں حنوک جمیا."
  - verse: 19
    text: "ول حنوک دا پیو ہون توں بعد یارد نے 800 سال جئے، تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 20
    text: "یارد دے سارے دن 962 سال ہوئے، ول اوہ مر گیا."
  - verse: 21
    text: "حنوک نے 65 سال جئے، ول حنوک تھوں متوشلح جمیا."
  - verse: 22
    text: "ول متوشلح دا پیو ہون توں بعد حنوک 300 سال خدا نال چلدا ریا، تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 23
    text: "حنوک دے سارے دن 365 سال ہوئے."
  - verse: 24
    text: "حنوک خدا نال چلدا ریا، تے اوہ لبھیا نہ گیا، کیوں جو خدا نے اوہنوں لے گیا."
  - verse: 25
    text: "متوشلح نے 187 سال جئے، ول متوشلح تھوں لامک جمیا."
  - verse: 26
    text: "ول لامک دا پیو ہون توں بعد متوشلح نے 782 سال جئے، تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 27
    text: "متوشلح دے سارے دن 969 سال ہوئے، ول اوہ مر گیا."
  - verse: 28
    text: "لامک نے 182 سال جئے، ول لامک تھوں اک پتر جمیا."
  - verse: 29
    text: "اوہنے اوہدے ناں نوح رکھیا، آکھیا: 'ایہ ساڈے کم تے ساڈے ہتھاں دی مشقت وچ سانوں آرام دیسی، اوہ زمین دے کارن جیہڑی خداوند نے لعنتی ٹھہرائی.'"
  - verse: 30
    text: "ول نوح دا پیو ہون توں بعد لامک نے 595 سال جئے، تے اوہنے ہور پتر تے دھیواں جمائیاں."
  - verse: 31
    text: "لامک دے سارے دن 777 سال ہوئے، ول اوہ مر گیا."
  - verse: 32
    text: "نوح 500 سال دا ہویا، ول نوح تھوں سام، حام، تے یافث جمے."
